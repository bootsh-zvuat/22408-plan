<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>22408 · 每日计划</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6feb'/%3E%3Ctext x='16' y='21.5' font-family='-apple-system,sans-serif' font-size='11' font-weight='700' fill='%23ffffff' text-anchor='middle'%3E408%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#6b7280;
    --line:#e6e8ec; --accent:#2f6feb; --ok:#0e9f6e; --danger:#d92d20;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --subj:#2f6feb; --subj-weak:#eef3fe; --subj-line:#bcd0f7;
  }
  body[data-subject="math2"]{--subj:#2f6feb;--subj-weak:#eef3fe;--subj-line:#bcd0f7}
  body[data-subject="cs408"]{--subj:#0e9f6e;--subj-weak:#e7f6ef;--subj-line:#bfe6d4}
  body[data-subject="english"]{--subj:#d97706;--subj-weak:#fef3c7;--subj-line:#f3d18e}
  body[data-subject="politics"]{--subj:#d92d20;--subj-weak:#fee4e2;--subj-line:#f3c1be}
  /* 科目固定色（跨科目混排时用，不随当前科目变） */
  .c-math2{--sc:#2f6feb;--scw:#eef3fe}
  .c-cs408{--sc:#0e9f6e;--scw:#e7f6ef}
  .c-english{--sc:#d97706;--scw:#fef3c7}
  .c-politics{--sc:#d92d20;--scw:#fee4e2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 18px 64px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:.2px}
  h2{font-size:16px;margin:0 0 10px}
  h3{font-size:14px;margin:18px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.4px}
  .sub{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  .bar{height:6px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:var(--accent);width:0}
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;line-height:1.7;white-space:nowrap}
  .k-learn{background:#e8f0fe;color:#1a56db}
  .k-practice{background:#f1e9fe;color:#7c3aed}
  .k-review{background:#fff3e0;color:#b45309}
  .k-rest{background:#f2f4f7;color:#6b7280}
  ul.pts{margin:6px 0 0;padding-left:20px}
  ul.pts li{margin:3px 0}
  .kv{display:flex;gap:10px;margin:10px 0;font-size:14px}
  .kv b{flex:0 0 52px;color:var(--muted);font-weight:500}
  label.check{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:9px;cursor:pointer;font-size:14px}
  label.check:hover{background:#f8f9fb}
  label.check input{margin-top:3px;accent-color:var(--ok);width:15px;height:15px;flex:0 0 auto}
  label.check.done span{color:#98a2b3;text-decoration:line-through}
  .ex{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin:10px 0;background:#fcfcfd}
  .ex .t{font-weight:600;font-size:14px;margin-bottom:4px}
  .ex .p{font-size:14px;white-space:pre-wrap;color:#333}
  .ex .hint{font-size:13px;color:var(--muted);margin-top:6px}
  .ex .ans{display:none;font-size:13.5px;background:#f4f7fb;border-left:3px solid var(--accent);
    padding:8px 10px;border-radius:6px;margin-top:8px;white-space:pre-wrap}
  .ex.open .ans{display:block}
  .btn{font:inherit;font-size:13.5px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:var(--text)}
  .btn:hover{border-color:#c9ced6}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{font-size:12.5px;padding:4px 9px}
  .btn.on{border-color:var(--danger);color:var(--danger)}
  .btn.sel{border-color:var(--accent);color:#1a56db;background:#eef3fe}
  .btn.danger{border-color:#f3c1be;color:#d92d20;background:#fff5f5}
  .weeks{margin-top:6px}
  .wk{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:10px 0;overflow:hidden;box-shadow:var(--shadow)}
  .wk-h{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
  .wk-h .n{font-size:12px;color:var(--muted);flex:0 0 46px}
  .wk-h .ti{font-weight:600;font-size:14px;flex:1}
  .wk-b{padding:0 14px 14px;display:none}
  .wk.open .wk-b{display:block}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;cursor:pointer;background:#fff;min-height:74px;position:relative}
  .day:hover{border-color:#bfc6d1}
  .day .wd{color:var(--muted);font-size:11px}
  .day .tt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;line-height:1.45}
  .day .dot{position:absolute;right:8px;top:9px;width:7px;height:7px;border-radius:99px;background:#e2e6eb}
  .day.done .dot{background:var(--ok)}
  .day.rest{background:#fafbfc;color:#98a2b3}
  .ck{display:inline-block;margin:0 0 8px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;
    background:#fff7e6;color:#a66a00;border:1px solid #ffe0a3}
  .empty{padding:26px;text-align:center;color:var(--muted)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .seg button{border:0;background:transparent;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:#eef3fe;color:#1a56db;font-weight:600}
  input[type=date]{font:inherit;font-size:13.5px;padding:5px 8px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .split{height:1px;background:var(--line);margin:14px 0}
  .list-prog{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:6px}
  .lp{font-size:13px}
  .lp .h{display:flex;justify-content:space-between;margin-bottom:4px}
  .wrong{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#fff;box-shadow:var(--shadow)}
  .wrong .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .wrong .head .t{font-weight:600;font-size:14px}
  .wrong .prompt{font-size:13.5px;color:#333;white-space:pre-wrap;margin-top:8px}
  .wrong textarea{width:100%;margin-top:10px;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);
    border-radius:9px;resize:vertical;min-height:56px;background:#fcfcfd}
  .wrong.mastered{opacity:.62}
  .wrong .meta{font-size:12px;color:var(--muted)}
  .phases{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .ph{flex:1 1 150px;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fbfcfd;
    cursor:pointer;font:inherit;text-align:left;color:var(--text);display:block}
  .ph:hover{border-color:#c9ced6;background:#f7f9fc}
  .ph.on{border-color:var(--subj);background:var(--subj-weak)}
  .ph.done{background:#f8fbfa}
  .ph .n{display:block;font-size:11px;color:var(--muted)}
  .ph .t{display:block;font-size:13.5px;font-weight:600;margin-top:2px}
  .ph .d{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
  .ph .pw{display:block;height:5px;background:#e9ecf1;border-radius:99px;overflow:hidden;margin-top:8px}
  .ph .pw>i{display:block;height:100%;background:var(--ok)}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:#eef3fe;color:#1a56db;white-space:nowrap}
  .pill.ok{background:#e7f6ef;color:#0e9f6e}
  .pill.wait{background:#f2f4f7;color:#6b7280}
  .phc{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:16px 18px;margin:12px 0}
  .phc.on{border-color:#bcd0f7}
  .phc-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .phc-h h2{margin:0}
  .phc .dates{font-size:12.5px;color:var(--muted);margin-top:4px}
  .ml{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:13.5px}
  .ml:first-of-type{border-top:0}
  .ml>b{flex:0 0 128px;font-size:13px;font-weight:600}
  .ml>b small{color:var(--muted);font-weight:400;margin-left:6px}
  .ml>span{flex:1;color:#333}
  .phc .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.4px;margin:15px 0 4px}
  .blk{display:flex;gap:10px;font-size:13px;padding:5px 0;border-top:1px dashed #eef0f3}
  .blk:first-of-type{border-top:0}
  .blk>b{flex:0 0 128px;font-weight:500}
  .blk>.c{flex:1;color:var(--muted)}
  .blk.detail>b{color:var(--accent)}
  .ckp{display:flex;gap:10px;font-size:13px;padding:4px 0;align-items:flex-start}
  .ckp .dt{flex:0 0 78px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .gcards .gcard{margin:0}
  .side-card{border-radius:14px}
  .chapters{margin-top:8px}
  .chapgroup{border-top:1px dashed var(--line);padding:4px 0}
  .chapgroup:first-child{border-top:0}
  .chapgroup summary{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;
    font-weight:600;color:#374151;padding:4px 0;list-style:none}
  .chapgroup summary>span:first-of-type{flex:1}
  .chapgroup summary::-webkit-details-marker{display:none}
  .chapgroup summary::before{content:'▸';color:var(--muted);margin-right:6px;font-size:11px}
  .chapgroup[open] summary::before{content:'▾'}
  .chap{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0 3px 16px;border-radius:6px}
  .chap input{width:14px;height:14px;accent-color:var(--ok);flex:0 0 auto}
  .chap.done span{color:#98a2b3;text-decoration:line-through}
  .chapters.wide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
  .chapters.wide .chapgroup{border:1px solid var(--line);border-radius:10px;padding:4px 10px 6px;border-top:1px solid var(--line)}
  @media (max-width:760px){.chapters.wide{grid-template-columns:1fr}}
  .heat-wrap{overflow-x:auto;padding:2px 0 6px;max-width:100%}
  .heat{display:inline-flex;gap:3px;align-items:flex-start}
  .heat .hcol{display:grid;grid-template-rows:repeat(7,12px);gap:3px}
  .heat .hd{width:12px;height:12px;border-radius:3px;background:#eef0f3;border:0;padding:0;cursor:pointer}
  .heat .hd.off{background:transparent;cursor:default}
  .heat .hd.lv1{background:var(--subj);opacity:.25}
  .heat .hd.lv2{background:var(--subj);opacity:.45}
  .heat .hd.lv3{background:var(--subj);opacity:.7}
  .heat .hd.lv4{background:var(--subj);opacity:1}
  .heat .hd.today{outline:2px solid var(--subj);outline-offset:1px}
  .heat .hd:hover{outline:1px solid #94a3b8;outline-offset:1px}
  .heat-wrap.static .hd{cursor:default}
  .heat-wrap.static .hd:hover{outline:none}
  .heat-months{display:flex;gap:3px;font-size:10.5px;color:var(--muted);margin-bottom:4px}
  .heat-months span{width:13px;flex:0 0 13px;overflow:visible;white-space:nowrap}
  .heat-legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:6px}
  .heat-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  .heat-stats{display:flex;gap:26px}
  .heat-stats b{display:block;font-size:20px;line-height:1.2;color:var(--text);font-variant-numeric:tabular-nums}
  .heat-stats span{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .heat .hd{width:13px;height:13px}
  .heat .hcol{grid-template-rows:repeat(7,13px)}
  .heat-legend i{width:11px;height:11px;border-radius:3px;background:var(--subj);display:inline-block}
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
    background:#111827;color:#fff;font-size:13px;padding:10px 14px;border-radius:11px;display:flex;gap:16px;
    align-items:center;box-shadow:0 12px 32px rgba(15,23,42,.22);transition:opacity .18s,transform .18s;z-index:99}
  #toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #toast button{background:none;border:0;color:#7dd3fc;font:inherit;cursor:pointer;padding:0}
  #toast button:hover{text-decoration:underline}
  .gcard{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:14px 16px;margin:10px 0}
  .gcard .badge{margin-right:2px}
  .gcard.dim{opacity:.66}
  .gcard .gt{font-size:14px;font-weight:600}
  .gcard .gword{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
  .gcard .gword .bar{min-width:80px}
  .wordcard{border:1px solid #d7e3fa;background:#f7faff;border-radius:12px;padding:13px 14px;margin:12px 0 6px}
  .wordcard input[type=number]{width:78px;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);
    border-radius:8px;background:#fff}
  .wordcard .bar{margin-top:8px}
  .wordcard .bar>i{background:linear-gradient(90deg,#2f6feb,#4f9bff)}
  .pseg{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
  .pseg-b{border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;
    font-size:13px;color:var(--muted);padding:7px 12px;line-height:1.4;text-align:left}
  .pseg-b:hover{border-color:#c9ced6;background:#f8fafc}
  .pseg-b.on{background:#eef3fe;border-color:#bcd0f7;color:#1a56db;font-weight:600}
  .pseg-b.done{color:#0e9f6e;border-color:#cfe9dd}
  .pseg-b small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
  .pnav{display:flex;gap:8px;align-items:center;margin:10px 0 0}
  .pnav .btn{font-size:13px}
  .phase-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:22px 0 2px}
  .phase-h h2{margin:0;font-size:15px}
  .wk.skel{box-shadow:none;background:#fbfcfd;border-style:dashed}
  .skel-h{display:flex;gap:10px;padding:9px 14px;font-size:12.5px;align-items:baseline;flex-wrap:wrap}
  .skel-h .n{flex:0 0 146px;color:var(--muted)}
  .skel-h .c{flex:1;color:#4b5563}
  footer{margin-top:26px;color:#9aa2b1;font-size:12px;text-align:center}
  @media (max-width:1040px){
    .gcards{grid-template-columns:1fr}
  }
  @media (max-width:760px){
    .days{grid-template-columns:repeat(2,1fr)}
    .list-prog{grid-template-columns:1fr}
    .ml>b,.blk>b{flex-basis:96px}
  }
  /* ============ v3：顶部导航 + 四页结构 ============ */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(246,247,249,.92);
    -webkit-backdrop-filter:saturate(180%) blur(8px);backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2f6feb,#7c3aed);
    color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;letter-spacing:.3px}
  .brand .bt{font-size:15px;font-weight:650;line-height:1.25}
  .brand .bs{font-size:11px;color:var(--muted);line-height:1.25}
  .nav{display:flex;gap:6px;flex:1 1 auto;flex-wrap:wrap}
  .nav button{border:1px solid transparent;background:transparent;font:inherit;font-size:15.5px;color:var(--muted);
    padding:9px 17px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .nav button:hover{background:#eef1f6;color:var(--text)}
  .nav button.on{background:#fff;color:var(--text);font-weight:600;border-color:var(--line);box-shadow:var(--shadow)}
  .nav button small{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
  .nav button.on small{color:#6b7280}
  .top-actions{display:flex;gap:6px;flex:0 0 auto}

  .hero{display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .hero h1{font-size:23px;margin:3px 0 6px;letter-spacing:.2px}
  .hero .lede{color:var(--muted);font-size:13px;max-width:62ch}
  .facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .fact{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:#374151}
  .fact b{font-variant-numeric:tabular-nums;font-weight:650}

  .ring{position:relative;width:96px;height:96px;flex:0 0 auto}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bg{fill:none;stroke:#eef0f3;stroke-width:3.6}
  .ring .fg{fill:none;stroke:var(--sc,#2f6feb);stroke-width:3.6;stroke-linecap:round;
    transition:stroke-dasharray .35s ease}
  .ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15}
  .ring .rt b{font-size:19px;font-variant-numeric:tabular-nums}
  .ring .rt span{font-size:11px;color:var(--muted)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .kpi b{display:block;font-size:19px;line-height:1.3;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11.5px;color:var(--muted)}
  .kpi .bar{margin-top:7px;height:5px}

  .sec{margin-top:26px}
  .sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}
  .sec-h h2{margin:0;font-size:15.5px}
  .sec > .card{margin:0}

  .subjbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px 12px;cursor:pointer;font:inherit;
    font-size:13.5px;color:var(--text);display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
  .chip .dot{width:8px;height:8px;border-radius:99px;background:var(--sc,#98a2b3)}
  .chip small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chip:hover{border-color:var(--sc,#c9ced6)}
  .chip.on{background:var(--scw,#eef3fe);border-color:var(--sc,#2f6feb);font-weight:600}
  .chip.on .dot{box-shadow:0 0 0 3px #fff}

  .anchors{position:sticky;top:var(--topbar-h,68px);z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;
    background:linear-gradient(180deg,var(--bg) 55%,rgba(246,247,249,.82));margin-bottom:2px}
  .anchors button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font:inherit;
    font-size:12.5px;color:#374151;cursor:pointer}
  .anchors button:hover{border-color:var(--subj);color:var(--subj)}

  .toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;
    border-top:1px dashed var(--line)}

  .wordtask{margin:2px 0 8px;padding:6px 9px 7px;border:1px dashed #d7e3fa;border-radius:10px;background:#f8fbff}
  .wordtask .check{padding:2px 0}
  .wordtask .wt-m{padding-left:32px;margin-top:1px;font-size:12px;color:var(--muted);line-height:1.55}

  .gword{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;

  .gword .bar{min-width:80px;margin:0}

  /* ---- 阶段甘特 ---- */
  .gantt{margin-top:6px}
  .gantt-scale{position:relative;height:16px;margin-left:104px;margin-bottom:5px}
  .gantt-scale span{position:absolute;top:0;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
  .grow2{display:flex;align-items:center;gap:10px;margin:7px 0}
  .grow2 .gl{flex:0 0 94px;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
  .grow2 .gl .dot{width:8px;height:8px;border-radius:99px;display:inline-block;flex:0 0 auto}
  .grow2 .track{position:relative;flex:1;height:30px;background:#f6f7f9;border-radius:9px}
  .gb{position:absolute;top:3px;bottom:3px;border:1px solid transparent;border-radius:7px;font:inherit;font-size:11px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;cursor:pointer;
    padding:0 4px;min-width:6px}
  .gb:hover{filter:brightness(.96);box-shadow:0 0 0 2px rgba(17,24,39,.1)}
  .gnow{position:absolute;top:-3px;bottom:-3px;width:2px;background:#111827;opacity:.3;border-radius:2px;pointer-events:none}

  .pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
  .pcard{margin:0}
  .plist{margin-top:8px}
  .phrow{border-top:1px dashed var(--line);padding:4px 0}
  .phrow summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;font-size:13px;list-style:none;padding:4px 0}
  .phrow summary::-webkit-details-marker{display:none}
  .phrow summary::before{content:'▸';color:var(--muted);font-size:10px;flex:0 0 auto}
  .phrow[open] summary::before{content:'▾'}
  .phrow .pn{font-weight:600}
  .phrow .pd{color:var(--muted);font-size:11.5px;margin-left:auto;white-space:nowrap}
  .phrow .pb{height:4px;background:#eef0f3;border-radius:99px;overflow:hidden;margin:2px 0 0}
  .phrow .pb>i{display:block;height:100%;background:var(--sc,#2f6feb)}
  .phbody{padding:4px 0 8px 16px}
  .lbl{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.4px;margin:10px 0 3px}
  .phbody .lbl:first-child{margin-top:2px}
  .phsub{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
  .phsub summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.4px}
  .phsub summary::-webkit-details-marker{display:none}
  .phsub summary::before{content:'▸';margin-right:5px;font-size:10px}
  .phsub[open] summary::before{content:'▾'}
  .txt{font-size:13.5px;color:#333}

  /* ---- 统计 ---- */
  .cmp{display:flex;flex-direction:column;gap:4px}
  .cmprow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid transparent;border-radius:10px;
    background:none;font:inherit;cursor:pointer;text-align:left;width:100%}
  .cmprow:hover{background:#f8fafc;border-color:var(--line)}
  .cmprow .nm{flex:0 0 86px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
  .cmprow .nm i{width:8px;height:8px;border-radius:99px;display:inline-block;flex:0 0 auto}
  .cmprow .bar{height:8px;margin:0}
  .cmprow .v{flex:0 0 110px;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .cmprow .arw{color:#c2c8d2;font-size:13px}
  .d7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .d7 .c{border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;background:#fbfcfd}
  .d7 .c.on{background:#eef3fe;border-color:#bcd0f7}
  .d7 .c b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .d7 .c span{font-size:11px;color:var(--muted)}

  /* ---- 单词柱状 ---- */
  .whist{display:flex;gap:6px;align-items:flex-end;height:76px;margin-top:8px}
  .whist .wh{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
  .whist .wh i{display:block;width:100%;background:#f3d18e;border-radius:4px 4px 0 0;min-height:2px}
  .whist .wh span{font-size:9.5px;color:var(--muted)}
  .whist .wh b{font-size:9.5px;color:#b45309;font-weight:500}

  .note{color:#374151;font-size:13px}
  .note ul.pts{margin-top:6px}
  .wrap{max-width:1180px;padding-top:20px}

  @media (max-width:640px){
    .wrap{padding:14px 12px 56px}
    .topbar-in{padding:8px 12px;gap:8px}
    .brand{flex:1 1 auto}
    .brand .bs{font-size:10.5px}
    .nav{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;gap:2px;padding-bottom:2px}
    .nav button{white-space:nowrap;font-size:14px;padding:7px 11px;border-radius:10px}
    .nav button small{display:none}
    .top-actions{order:2}
    .top-actions .btn{font-size:12px;padding:4px 9px}
    .hero{display:block;position:relative;padding-right:84px}

    .hero h1{font-size:20px}
    .facts{gap:6px}
    .fact{font-size:11.5px;padding:4px 8px}
    .gcard .gword .bar{display:none}
    .gcard .gword{margin-top:8px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi b{font-size:17px}
    .day .tt{-webkit-line-clamp:4}
    .whist{overflow-x:auto;padding-bottom:4px}
    .whist .wh{flex:0 0 44px}
    .cmprow .v{flex:0 0 88px;font-size:11.5px}
    .gantt{overflow-x:auto;padding-bottom:6px}
    .gantt-scale,.grow2{min-width:620px}
    .subjhead .kpis{grid-template-columns:repeat(2,1fr)}
    .topbar .top-actions .btn{white-space:nowrap}
  }
  @media (max-width:860px){
    .pgrid{grid-template-columns:1fr}
    .grow2 .gl{flex:0 0 62px;font-size:12px}
    .gantt-scale{margin-left:72px}

    .hero{gap:14px}
    .hero .ring{width:78px;height:78px}
    .cmprow .sub{display:none}
  }
</style>

<script id="plan-math2" type="application/json">__PLAN_MATH2__</script>
<script id="plan-cs408" type="application/json">__PLAN_CS408__</script>
<script id="plan-english" type="application/json">__PLAN_ENGLISH__</script>
<script id="plan-politics" type="application/json">__PLAN_POLITICS__</script>
<script>
(function(){
  "use strict";
  var PLANS = {
    math2: JSON.parse(document.getElementById('plan-math2').textContent),
    cs408: JSON.parse(document.getElementById('plan-cs408').textContent),
    english: JSON.parse(document.getElementById('plan-english').textContent),
    politics: JSON.parse(document.getElementById('plan-politics').textContent)
  };
  var KEY = 'study-22408-v2';
  var OLD_KEY = 'math2-plan-state-v1';
  var KINDS = {learn:'学习', practice:'练习', review:'复盘', rest:'机动'};

  var cache = {};
  function daysOf(p){
    if(cache[p]) return cache[p];
    var list = [];
    PLANS[p].weeks.forEach(function(w){
      w.days.forEach(function(d){
        list.push(Object.assign({}, d, {week:w.week, weekTitle:w.title, pid:p}));
      });
    });
    cache[p] = list;
    return list;
  }
  function dayById(p, id){
    return daysOf(p).filter(function(d){ return d.id === id; })[0];
  }

  var state = load();
  function blank(p){
    return {startDate: PLANS[p].startDate, mode:'progress', offset:null, checks:{}};
  }
  function normalize(s){
    if(!s.plans) s.plans = {};
    Object.keys(PLANS).forEach(function(k){
      if(!s.plans[k]) s.plans[k] = blank(k);
      if(!s.plans[k].checks) s.plans[k].checks = {};
    });
    if(!s.active || !PLANS[s.active]) s.active = Object.keys(PLANS)[0];
    if(!s.wrong) s.wrong = {};
    return s;
  }
  function emptyState(){
    var s = {active:'math2', plans:{}, wrong:{}};
    Object.keys(PLANS).forEach(function(k){ s.plans[k] = blank(k); });
    return s;
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var s = JSON.parse(raw);
        if(s && s.plans && s.active && PLANS[s.active]) return normalize(s);
      }
    }catch(e){}
    var s = emptyState();
    try{
      var old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
      if(old && old.checks){
        s.plans.math2.checks = old.checks;
        s.plans.math2.mode = old.mode || 'progress';
        if(old.startDate) s.plans.math2.startDate = old.startDate;
      }
    }catch(e){}
    return s;
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function P(){ return state.plans[state.active]; }
  function pid(){ return state.active; }
  function plan(){ return PLANS[state.active]; }

  function Pof(p){ return state.plans[p]; }
  function planOf(p){ return PLANS[p]; }
  function dsOf(p, dayId){
    var st = Pof(p);
    if(!st.checks) st.checks = {};
    if(!st.checks[dayId]) st.checks[dayId] = {c:[], e:[], done:false};
    var s = st.checks[dayId];
    if(!s.c) s.c = [];
    if(!s.e) s.e = [];
    return s;
  }
  function ds(dayId){ return dsOf(pid(), dayId); }
  function isRest(d){ return d.kind === 'rest'; }
  function isDoneOf(p, d){
    if(isRest(d)) return true;
    var st = Pof(p);
    var sc = st.checks && st.checks[d.id];
    return !!(sc && sc.done);
  }
  function isDone(d){ return isDoneOf(pid(), d); }
  function studyDays(p){ return daysOf(p).filter(function(d){ return d.kind === 'learn' || d.kind === 'practice'; }); }
  function reviewDays(p){ return daysOf(p).filter(function(d){ return d.kind === 'review'; }); }
  function exTotal(p){ return daysOf(p).reduce(function(n,d){ return n + (d.exercises ? d.exercises.length : 0); }, 0); }
  function exDone(p){
    return daysOf(p).reduce(function(n,d){
      var s = state.plans[p].checks[d.id];
      return n + (d.exercises || []).filter(function(_,i){ return s && s.e && s.e[i]; }).length;
    }, 0);
  }
  function revDone(p){
    return reviewDays(p).filter(function(d){
      var s = state.plans[p].checks[d.id]; return s && s.done;
    }).length;
  }
  function nextUndoneOf(p){
    var st = studyDays(p);
    for(var i=0;i<st.length;i++){ if(!isDoneOf(p, st[i])) return st[i]; }
    return null;
  }
  function nextUndone(){ return nextUndoneOf(pid()); }
  function byDateOf(p){
    var st = Pof(p);
    var start = new Date(st.startDate + 'T00:00:00');
    var now = new Date(); now.setHours(0,0,0,0);
    var off = Math.round((now - start)/86400000);
    var list = daysOf(p);
    if(off < 0) return list[0];
    if(off >= list.length) return null;
    return list[off];
  }
  function byDate(){ return byDateOf(pid()); }
  function curDayOf(p){
    var st = Pof(p);
    var list = daysOf(p);
    if (st.pinDate && st.pinDate !== fmt(todayD())) {
      st.pinDate = null;
      st.offset = null;
    }
    if(st.offset !== null && st.offset !== undefined && list[st.offset]) return list[st.offset];
    if(st.mode === 'date') return byDateOf(p);
    return nextUndoneOf(p) || list[list.length-1];
  }
  function curDay(){ return curDayOf(pid()); }
  // ---- 单词进度（英语专用：词库总数 + 每日量 + 打卡）
  function wordBookOf(p){ return planOf(p).wordBook || null; }
  function wordStateOf(p){
    var wb = wordBookOf(p);
    if(!wb) return null;
    var st = Pof(p);
    if(!st.words) st.words = { done: wb.startDone || 0, cycle: wb.startCycle || 1, perDay: wb.defaultPerDay || 100, log: {} };
    var w = st.words;
    if(!w.log) w.log = {};
    if(!w.perDay) w.perDay = wb.defaultPerDay || 100;
    if(w.done == null) w.done = wb.startDone || 0;
    if(w.cycle == null) w.cycle = 1;
    return w;
  }
  function wordTodayOf(p){
    var w = wordStateOf(p);
    if(!w) return 0;
    return w.log[fmt(todayD())] || 0;
  }
  function wordLogOf(p, n){
    var w = wordStateOf(p);
    if(!w) return;
    var k = fmt(todayD());
    w.log[k] = Math.max(0, (w.log[k] || 0) + n);
    w.done = Math.max(0, w.done + n);
    if(!w.log[k]) delete w.log[k];
    save();
  }
  function wordBook(){ return wordBookOf(pid()); }
  function wordState(){ return wordStateOf(pid()); }
  function wordToday(){ return wordTodayOf(pid()); }
  function wordLog(n){ return wordLogOf(pid(), n); }
  function wordRangeOf(p){
    var wb = wordBookOf(p), w = wordStateOf(p);
    if(!wb || !w) return null;
    var total = wb.total, done = Math.min(w.done, total);
    var per = w.perDay || 100;
    var from = done + 1, to = Math.min(total, done + per);
    var groups = wb.lists || 50;
    var perGroup = total / groups;
    var gi = Math.min(groups, Math.floor(done / perGroup) + 1);
    var logged = w.log[fmt(todayD())] || 0;
    var tFrom = Math.max(1, done - logged + 1);
    var tTo = Math.min(total, tFrom + per - 1);
    var tGroup = Math.min(groups, Math.floor((tFrom - 1) / perGroup) + 1);
    return { total: total, done: done, remain: total - done, per: per, from: from, to: to, group: gi,
             tFrom: tFrom, tTo: tTo, tGroup: tGroup, logged: logged,
             pct: Math.min(100, Math.round(done / total * 1000) / 10), w: w };
  }
  function wordRange(){ return wordRangeOf(pid()); }
  function wordCardHtml(){
    var r = wordRange();
    if(!r) return '';
    var wb = wordBook(), w = r.w, td = wordToday();
    var target = r.per || 100;
    var todayPct = Math.min(100, Math.round(td / target * 100));
    var days = target > 0 ? Math.ceil(r.remain / target) : 0;
    var finish = new Date(todayD().getTime() + days * 86400000);
    var doneToday = td >= target;
    var html = '<div class="wordcard">' +
      '<div class="row"><b style="font-size:13.5px">今日单词 · 第 ' + w.cycle + ' 轮</b>' +
      '<span class="pill">' + esc(wb.name) + ' ' + r.total + ' 词</span><div class="grow"></div>' +
      '<span class="sub">本轮 ' + r.done + ' / ' + r.total + ' · ' + r.pct + '%</span></div>' +
      '<div class="row" style="margin-top:10px;align-items:baseline">' +
      '<span style="font-size:13px">今日目标 <b>' + target + '</b> 词</span>' +
      '<div class="grow"></div><span class="sub">已背 <b>' + td + '</b> / ' + target + (doneToday ? ' · 已达标' : '') + '</span></div>' +
      '<div class="bar"><i style="width:' + todayPct + '%"></i></div>' +
      '<div style="margin-top:8px;font-size:12.5px;color:var(--muted)">' +
      (r.remain > 0
        ? '今天背第 ' + r.tFrom + '–' + r.tTo + ' 词（' + esc(wb.name) + '第 ' + r.tGroup + ' 组）· 本轮剩 ' + r.remain +
          ' 词，按每天 ' + target + ' 词 → 约 ' + days + ' 天，' + fmt(finish) + ' 背完'
        : '本轮 ' + r.total + ' 词已背完') + '</div>';
    if(r.remain > 0){
      if(!doneToday){
        html += '<div class="row" style="margin-top:10px">' +
          '<span class="sub">今天实际背了</span>' +
          '<input id="wnum" type="number" min="0" max="600" step="10" value="' + Math.max(0, target - td) + '">' +
          '<span class="sub">词</span>' +
          '<button class="btn pri sm" id="wlog">打卡</button>' +
          '<button class="btn sm" id="wundo">撤销今日</button>' +
          '<span class="sub">默认补齐今日目标；只背了一部分就填实际数量</span>' +
          '</div>';
      }else{
        html += '<div class="row" style="margin-top:10px">' +
          '<span class="sub">今日单词已达标（' + td + ' / ' + target + '）</span>' +
          '<button class="btn sm" id="wundo">撤销今日</button>' +
          '<span class="sub">明天自动从第 ' + (r.done + 1) + ' 词继续</span></div>';
      }
      html += '<div class="row" style="margin-top:10px"><span class="sub">每日单词量</span>' +
        '<button class="btn sm" data-wstep="-20">−</button>' +
        '<input id="wpd" type="number" min="10" max="600" step="10" value="' + target + '">' +
        '<button class="btn sm" data-wstep="20">+</button>' +
        [60, 80, 100, 150].map(function(v){
          return '<button class="btn sm' + (v === target ? ' sel' : '') + '" data-wset="' + v + '">' + v + '</button>';
        }).join('') +
        '</div>' +
        '<div class="row" style="margin-top:8px"><span class="sub">进度校准</span>' +
        '<input id="wdone" type="number" min="0" max="' + r.total + '" value="' + w.done + '">' +
        '<button class="btn sm" id="wsave">保存</button>' +
        '<span class="sub">背到第几个词就填几，用来修正</span></div>';
    }else{
      html += '<div class="row" style="margin-top:10px"><button class="btn pri sm" id="wnext">开始第 ' + (w.cycle + 1) + ' 轮</button>' +
        '<span class="sub">本轮 ' + r.total + ' 词已过完</span></div>';
    }
    return html + '</div>';
  }
  function wordRowHtml(p){
    p = p || pid();
    var r = wordRangeOf(p);
    if(!r) return '';
    var td = wordTodayOf(p);
    var target = r.per || 100;
    var done = td >= target;
    var label = r.remain > 0
      ? '今日单词 ' + target + ' 词（第 ' + r.tFrom + '–' + r.tTo + ' 词）'
      : '今日单词（本轮 ' + r.total + ' 词已背完）';
    var d0 = curDayOf(p);
    var hasReview = d0 ? checklistOf(p, d0).some(function (it) { return /昨天|复习/.test(it.text); }) : false;
    var yLog = r.w.log[fmt(new Date(todayD().getTime() - 86400000))] || 0;
    var yHint = (!hasReview && yLog > 0) ? ' · 顺带复习昨天 ' + yLog + ' 词' : '';
    return '<div class="wordtask' + (done ? ' done' : '') + '">' +
      '<label class="check ' + (done ? 'done' : '') + '"><input type="checkbox" data-wp="' + p + '"' +
      (done ? ' checked' : '') + '><span>' + esc(label) + '</span></label>' +
      '<div class="sub wt-m">已背 <b>' + td + '</b> / ' + target + ' · ' + esc(wordBookOf(p).name) + '第 ' + r.tGroup +
      ' 组 · 本轮 ' + r.done + ' / ' + r.total + '（' + r.pct + '%）' +
      (done ? ' · 今日单词已达标' : ' · 还差 ' + (target - td) + ' 词') + yHint + '</div>' +
      '</div>';
  }

  // ---- 章节进度（数学二 / 408：按武忠祥 / 王道章节勾）
  function courseOf(p){ return planOf(p).course || null; }
  function chapterStateOf(p){
    var st = Pof(p);
    if(!st.chapters) st.chapters = {};
    return st.chapters;
  }
  function chapterStatsOf(p){
    var c = courseOf(p);
    if(!c) return null;
    var cs = chapterStateOf(p);
    var total = 0, done = 0, groups = [];
    c.books.forEach(function(b){
      var d = 0;
      b.chapters.forEach(function(ch){ total++; if(cs[ch.id] && cs[ch.id].done){ done++; d++; } });
      groups.push({id: b.id, name: b.name, short: b.short || b.name, book: b.book,
                   done: d, total: b.chapters.length, pct: b.chapters.length ? Math.round(d / b.chapters.length * 100) : 0});
    });
    return {total: total, done: done, pct: total ? Math.round(done / total * 100) : 0,
            groups: groups, books: c.books, state: cs, title: c.title};
  }
  function chapterListHtml(p){
    var cs = chapterStatsOf(p);
    if(!cs) return '';
    return cs.books.map(function(b, bi){
      var g = cs.groups[bi];
      var open = cs.total <= 12 || bi === 0;
      return '<details class="chapgroup"' + (open ? ' open' : '') + '>' +
        '<summary><span>' + esc(b.short || b.name) + '</span><span class="sub" data-chapgroup="' + b.id + '">' + g.done + '/' + g.total + '</span></summary>' +
        b.chapters.map(function(ch){
          var st = cs.state[ch.id] || {};
          return '<label class="chap' + (st.done ? ' done' : '') + '"><input type="checkbox" data-chapter="' + p + '|' + ch.id + '"' +
            (st.done ? ' checked' : '') + '><span>' + esc(ch.name) + '</span></label>';
        }).join('') + '</details>';
    }).join('');
  }
  function chapterCardHtml(p){
    var cs = chapterStatsOf(p);
    if(!cs) return '';
    return '<div class="card side-card" data-chap-card><div class="row"><b>' + esc(cs.title) + '</b>' +
      '<div class="grow"></div><span class="sub" data-chap-total>' + cs.done + ' / ' + cs.total + ' 章</span></div>' +
      '<div class="bar" style="margin-top:8px"><i data-chap-bar style="width:' + cs.pct + '%"></i></div>' +
      '<div class="chapters">' + chapterListHtml(p) + '</div>' +
      '<div class="sub" style="margin-top:6px">过完一章勾一章；点书名列可收起。</div></div>';
  }

  function fmt(d){
    if(!d) return '';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // ---- 阶段（phase）：全年四段，日期区间 + 目标 + 主线 + 门槛 + 周骨架
  function dISO(s){ return new Date(String(s).slice(0,10) + 'T00:00:00'); }
  function todayD(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function diffDays(a,b){ return Math.round((a - b)/86400000); }
  function shortDate(s){ return String(s || '').slice(2).replace(/-/g, '.'); }
  function phaseState(ph){
    var now = todayD();
    if(now > dISO(ph.end)) return 'done';
    if(now >= dISO(ph.start)) return 'active';
    return 'todo';
  }
  function curPhaseOf(p){
    var list = planOf(p).phases || [], now = todayD();
    if(!list.length) return null;
    for(var i=0;i<list.length;i++){ if(now <= dISO(list[i].end)) return list[i]; }
    return list[list.length-1];
  }
  function phaseWeekIndex(ph){
    var n = Math.floor(diffDays(todayD(), dISO(ph.start))/7) + 1;
    if(n < 1) n = 1;
    if(n > ph.weeks) n = ph.weeks;
    return n;
  }
  function phaseBadge(ph){
    var st = phaseState(ph);
    return st === 'done' ? '<span class="pill ok">已结束</span>'
      : st === 'active' ? '<span class="pill">进行中 · 第 ' + phaseWeekIndex(ph) + '/' + ph.weeks + ' 周</span>'
      : '<span class="pill wait">未开始</span>';
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function streak(p){
    var st = studyDays(p), n = 0;
    for(var i=0;i<st.length;i++){
      var s = state.plans[p].checks[st[i].id];
      if(s && s.done) n++; else break;
    }
    return n;
  }

  // ---- 轻提示 + 撤销
  var toastTimer = null;
  function hideToast(){
    var t = document.getElementById('toast');
    if(t) t.classList.remove('show');
  }
  function toast(msg, actionLabel, actionFn){
    var t = document.getElementById('toast');
    if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.innerHTML = '<span></span>';
    t.firstChild.textContent = msg;
    if(actionLabel){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = actionLabel;
      b.addEventListener('click', function(){ hideToast(); if(actionFn) actionFn(); });
      t.appendChild(b);
    }
    clearTimeout(toastTimer);
    t.classList.add('show');
    toastTimer = setTimeout(hideToast, 4200);
  }
  function shortText(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }

  // ---- 打卡日历（日期 → 当天打卡次数）
  function planStartOf(p){ return dISO(planOf(p).startDate); }
  function dayDateOf(p, idx){ return new Date(planStartOf(p).getTime() + idx * 86400000); }
  function checkinMap(p){
    var map = {}, checks = Pof(p).checks || {};
    daysOf(p).forEach(function(d, i){
      var st = checks[d.id];
      if(st && st.done){
        var at = st.at || fmt(dayDateOf(p, i));
        map[at] = (map[at] || 0) + 1;
      }
    });
    var w = wordStateOf(p);
    if(w && w.log) Object.keys(w.log).forEach(function(k){ if(w.log[k] > 0) map[k] = (map[k] || 0) + 1; });
    var cs = chapterStateOf(p);
    Object.keys(cs).forEach(function(k){
      if(cs[k] && cs[k].done && cs[k].at) map[cs[k].at] = (map[cs[k].at] || 0) + 1;
    });
    return map;
  }
  function streakOfMap(map){
    var d = todayD(), n = 0;
    if(!map[fmt(d)]) d = new Date(d.getTime() - 86400000);
    while(map[fmt(d)]){ n++; d = new Date(d.getTime() - 86400000); }
    return n;
  }
  function heatmapHtml(p){
    var map = checkinMap(p), days = daysOf(p);
    if(!days.length) return '';
    var start = planStartOf(p), weeks = Math.ceil(days.length / 7), todayS = fmt(todayD());
    var months = '', cols = '', lastMonth = -1;
    for(var w = 0; w < weeks; w++){
      var mon = new Date(start.getTime() + w * 7 * 86400000);
      months += '<span>' + (mon.getMonth() !== lastMonth ? (mon.getMonth() + 1) + '月' : '') + '</span>';
      lastMonth = mon.getMonth();
      var col = '';
      for(var dow = 0; dow < 7; dow++){
        var idx = w * 7 + dow;
        var ds = fmt(new Date(start.getTime() + idx * 86400000));
        var inRange = idx < days.length;
        var count = inRange ? (map[ds] || 0) : 0;
        var lv = count > 0 ? Math.min(4, count) : 0;
        col += '<button type="button" class="hd' + (inRange ? (lv ? ' lv' + lv : '') : ' off') +
          (ds === todayS ? ' today' : '') + '" data-hidx="' + idx + '"' +
          (inRange ? ' title="' + ds + ' · ' + count + ' 次打卡"' : '') + '></button>';
      }
      cols += '<div class="hcol">' + col + '</div>';
    }
    var startMs = start.getTime();
    var activeDays = 0, best = 0, run = 0, prevOk = false;
    for(var ii = 0; ii < days.length; ii++){
      var kk = fmt(new Date(startMs + ii * 86400000));
      var ok = (map[kk] || 0) > 0;
      if(ok){ activeDays++; run = prevOk ? run + 1 : 1; if(run > best) best = run; }
      else run = 0;
      prevOk = ok;
    }
    var streak = streakOfMap(map);
    return '<div class="heat-top">' +
      '<div class="heat-legend"><span>少</span><i style="opacity:.25"></i><i style="opacity:.45"></i>' +
      '<i style="opacity:.7"></i><i></i><span>多</span></div>' +
      '<div class="heat-stats">' +
      '<div><b>' + activeDays + '</b><span>天打卡</span></div>' +
      '<div><b>' + streak + '</b><span>当前连续</span></div>' +
      '<div><b>' + best + '</b><span>最长连续</span></div>' +
      '</div></div>' +
      '<div class="heat-wrap"><div class="heat-months">' + months + '</div>' +
      '<div class="heat">' + cols + '</div></div>';
  }

  // =====================================================================
  // v3 交互层：今日计划 / 总体统计 / 阶段总览 / 单科详情（每科一页）
  // =====================================================================
  var SUBJ_ORDER = ['math2', 'cs408', 'english', 'politics'];
  var SUBJ_FULL = {math2: '数学二', cs408: '408', english: '英语', politics: '政治'};
  var SUBJ_COLOR = {math2: '#2f6feb', cs408: '#0e9f6e', english: '#d97706', politics: '#d92d20'};
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var VIEWS = ['today', 'stats', 'phases', 'subject'];
  var view = 'today';
  var pendingAnchor = null;

  if (!state.ui || !state.ui.view || VIEWS.indexOf(state.ui.view) < 0) {
    state.ui = {view: 'today'};
  }

  // ---------------- 通用小部件 ----------------
  function hexa(hex, a) {
    var h = String(hex).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function ringHtml(pct, label, color) {
    var c = 2 * Math.PI * 15.5;
    var p = Math.max(0, Math.min(100, pct || 0));
    var len = (p / 100 * c).toFixed(2);
    return '<div class="ring" style="--sc:' + (color || '#2f6feb') + '">' +
      '<svg viewBox="0 0 36 36" aria-hidden="true">' +
      '<circle class="bg" cx="18" cy="18" r="15.5"></circle>' +
      (p > 0 ? '<circle class="fg" cx="18" cy="18" r="15.5" stroke-dasharray="' + len + ' ' + (c - len).toFixed(2) + '"></circle>' : '') +
      '</svg><div class="rt"><b>' + p + '%</b><span>' + esc(label) + '</span></div></div>';
  }
  function kpi(big, label, pct, color) {
    var bar = (pct === null || pct === undefined) ? '' :
      '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%' +
      (color ? ';background:' + color : '') + '"></i></div>';
    return '<div class="kpi"><b>' + esc(big) + '</b><span>' + esc(label) + '</span>' + bar + '</div>';
  }
  function secHead(title, sub) {
    return '<div class="sec-h"><h2>' + esc(title) + '</h2>' + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</div>';
  }
  function subjectProgress(p) {
    var days = studyDays(p);
    var done = days.filter(function (d) { return isDoneOf(p, d); }).length;
    return {total: days.length, done: done, pct: days.length ? Math.round(done / days.length * 100) : 0};
  }
  function phaseStatsOf(p, ph) {
    var out = {weeks: 0, study: 0, done: 0, ex: 0, exDone: 0, rev: 0, revDone: 0};
    (planOf(p).weeks || []).forEach(function (w) {
      if (w.phase !== ph.id) return;
      out.weeks++;
      (w.days || []).forEach(function (d) {
        var s = Pof(p).checks[d.id] || {};
        if (d.kind === 'learn' || d.kind === 'practice') {
          out.study++;
          if (s.done) out.done++;
        } else if (d.kind === 'review') {
          out.rev++;
          if (s.done) out.revDone++;
        }
        (d.exercises || []).forEach(function (_, i) {
          out.ex++;
          if (s.e && s.e[i]) out.exDone++;
        });
      });
    });
    return out;
  }
  // 英语的「今日单词」只由词库驱动；计划清单里的单词项不再重复占勾
  function isWordOnlyItem(t) {
    var x = String(t || '');
    return /新词/.test(x) || /单词\s*\d/.test(x) || /List/.test(x) || /今日量过完/.test(x);
  }
  function checklistOf(p, d) {
    var out = [], hide = !!wordBookOf(p);
    (d.checklist || []).forEach(function (t, i) {
      if (hide && isWordOnlyItem(t)) return;
      out.push({text: t, i: i});
    });
    return out;
  }
  function wordTargetOf(p) {
    var w = wordStateOf(p);
    return w ? (w.perDay || 100) : 0;
  }
  function wordTaskDoneOf(p) {
    if (!wordBookOf(p)) return true;
    return wordTodayOf(p) >= wordTargetOf(p);
  }
  function dayDoneNow(p, d, st) {
    var items = checklistOf(p, d);
    return items.every(function (it) { return !!st.c[it.i]; }) && wordTaskDoneOf(p);
  }
  function syncDone(p, d, st) {
    var items = checklistOf(p, d);
    if (!items.length && !wordBookOf(p)) return;
    if (dayDoneNow(p, d, st)) {
      if (!st.done) { st.done = true; st.at = fmt(todayD()); }
    } else {
      st.done = false;
      delete st.at;
    }
  }
  // 动完十字后更新完成态；完成了就把这天固定住，不再自动跳到下一天
  function pinDay(p, idx) {
    var st = Pof(p);
    st.offset = idx;
    st.pinDate = fmt(todayD());
  }
  function unpinDay(p) {
    var st = Pof(p);
    st.offset = null;
    st.pinDate = null;
  }
  function afterDayChange(p, d) {
    if (!d) return;
    var st = dsOf(p, d.id);
    syncDone(p, d, st);
    if (st.done) {
      var i = daysOf(p).indexOf(d);
      if (i >= 0) pinDay(p, i);
    }
    save();
  }
  function advanceDay(p) {
    var list = daysOf(p), cur = curDayOf(p);
    var i = list.indexOf(cur), n = i + 1;
    while (n < list.length && isRest(list[n])) n++;
    if (n >= list.length) { toast('已经是最后一天了'); return; }
    pinDay(p, n);
    save();
    if (view === 'subject') {
      render();
      scrollToSec('sec-day');
    } else {
      var y = window.pageYOffset;
      render();
      window.scrollTo(0, y);
    }
  }
  function toggleWordTask(p, checked) {
    var target = wordTargetOf(p), td = wordTodayOf(p);
    if (checked) {
      if (td < target) wordLogOf(p, target - td);
    } else if (td > 0) {
      wordLogOf(p, -td);
    }
    afterDayChange(p, curDayOf(p));
    refresh();
  }
  function nextStudyAfterOf(p, d) {
    var list = daysOf(p);
    for (var k = list.indexOf(d) + 1; k < list.length; k++) {
      if (!isRest(list[k])) return list[k];
    }
    return null;
  }
  function stepDay(p, dir) {
    var list = daysOf(p), cur = curDayOf(p);
    var n = list.indexOf(cur) + dir;
    if (n < 0 || n >= list.length) return;
    pinDay(p, n);
    save();
    render();
    scrollToSec('sec-day');
  }
  function logWordsFor(p, n) {
    var wb = wordBookOf(p);
    var before = wordStateOf(p).done;
    wordLogOf(p, n);
    var after = wordStateOf(p).done;
    var today = wordTodayOf(p), target = wordTargetOf(p);
    afterDayChange(p, curDayOf(p));
    toast('单词 ' + (n > 0 ? '+' : '') + n + '（今日 ' + today + ' / ' + target + ' · 本轮 ' + after + ' / ' + wb.total + '）',
      '撤销', function () {
        wordLogOf(p, before - after);
        afterDayChange(p, curDayOf(p));
        refresh();
      });
    refresh();
  }

  // ---------------- 路由 ----------------
  function readHash() {
    var raw = String(location.hash || '').replace(/^#\/?/, '');
    if (!raw) return null;
    var parts = raw.split('/');
    var v = VIEWS.indexOf(parts[0]) >= 0 ? parts[0] : null;
    if (!v) return null;
    if (parts[1] && PLANS[parts[1]]) state.active = parts[1];
    return v;
  }
  function go(v, p, anchor) {
    if (p && PLANS[p]) state.active = p;
    view = v;
    state.ui = {view: v, subject: state.active};
    save();
    pendingAnchor = anchor || null;
    var h = '#/' + v + (v === 'subject' ? '/' + state.active : '');
    if (location.hash === h) {
      render();
      applyPendingScroll();
    } else {
      location.hash = h;
    }
  }
  function stickyOffset() {
    var top = document.querySelector('.topbar');
    var bar = document.querySelector('.anchors');
    var h = top ? top.offsetHeight : 0;
    if (bar && window.getComputedStyle(bar).position === 'sticky') h += bar.offsetHeight;
    return h + 12;
  }
  function applyPendingScroll() {
    if (pendingAnchor) {
      var id = pendingAnchor;
      pendingAnchor = null;
      var t = document.getElementById(id);
      if (t) {
        window.scrollTo(0, Math.max(0, t.getBoundingClientRect().top + window.pageYOffset - stickyOffset()));
        return;
      }
    }
    window.scrollTo(0, 0);
  }
  function scrollToSec(id) {
    var t = document.getElementById(id);
    if (!t) return;
    window.scrollTo(0, Math.max(0, t.getBoundingClientRect().top + window.pageYOffset - stickyOffset()));
  }
  function refresh() {
    var y = window.pageYOffset;
    render();
    window.scrollTo(0, y);
  }
  function syncTop() {
    document.querySelectorAll('#nav [data-nav]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.nav === view);
    });
    var g = todayTotals();
    var nt = document.getElementById('navToday');
    if (nt) nt.textContent = g.done + '/' + g.total;
    var ns = document.getElementById('navSubject');
    if (ns) ns.textContent = SUBJ_FULL[state.active];
    var cd = document.getElementById('countdown');
    if (cd) cd.textContent = '距初试 ' + Math.max(0, diffDays(dISO(PLANS.math2.examDate), todayD())) + ' 天';
  }
  function syncStickyOffsets() {
    var top = document.querySelector('.topbar');
    if (top) document.documentElement.style.setProperty('--topbar-h', top.offsetHeight + 'px');
  }
  function render() {
    document.body.setAttribute('data-subject', view === 'subject' ? state.active : 'all');
    syncTop();
    syncStickyOffsets();
    var el = document.getElementById('view');
    if (view === 'stats') el.innerHTML = statsPageHtml();
    else if (view === 'phases') el.innerHTML = phasesPageHtml();
    else if (view === 'subject') el.innerHTML = subjectPageHtml();
    else el.innerHTML = todayPageHtml();
    bindView();
  }

  // ---------------- 今日计划 ----------------
  function todayOf(p) {
    var data = planOf(p);
    if (data.startsLater && todayD() < dISO(data.startDate)) {
      return {p: p, data: data, notStarted: true, wait: diffDays(dISO(data.startDate), todayD()), total: 0, done: 0};
    }
    var d = curDayOf(p);
    if (!d) return {p: p, data: data, over: true, total: 0, done: 0};
    var sc = dsOf(p, d.id), wb = !!data.wordBook;
    var items = checklistOf(p, d);
    var total = items.length + (wb ? 1 : 0);
    var done = items.filter(function (it) { return !!sc.c[it.i]; }).length +
      (wb && wordTaskDoneOf(p) ? 1 : 0);
    return {p: p, data: data, day: d, sc: sc, wb: wb, items: items, total: total, done: done,
            complete: isDoneOf(p, d)};
  }
  function todayTotals() {
    var out = {done: 0, total: 0, per: {}};
    SUBJ_ORDER.forEach(function (p) {
      var t = todayOf(p);
      out.done += t.done;
      out.total += t.total;
      out.per[p] = t;
    });
    return out;
  }
  function todayPageHtml() {
    var g = todayTotals();
    var pct = g.total ? Math.round(g.done / g.total * 100) : 0;
    var ph = curPhaseOf('math2');
    var startD = dISO(PLANS.math2.startDate);

    var h = '<div class="card hero">' +
      '<div class="grow">' +
      '<div class="sub">' + fmt(todayD()) + ' · ' + WD[todayD().getDay()] + '</div>' +
      '<h1>今日计划</h1>' +
      '<div class="lede">四科今天的清单，勾完就算今天打卡。英语的今日单词直接在这里勾；章节、课后题、单词设置进「单科详情」。</div>' +
      '<div class="facts">' +
      '<span class="fact">距初试 <b>' + Math.max(0, diffDays(dISO(PLANS.math2.examDate), todayD())) + '</b> 天</span>' +
      (notYet ? '<span class="fact">计划 <b>' + shortDate(PLANS.math2.startDate) + '</b> 开始 · 还有 ' + diffDays(startD, todayD()) + ' 天</span>' : '') +
      (ph ? '<span class="fact">当前 <b>' + esc(ph.short) + '</b> · 第 ' + phaseWeekIndex(ph) + '/' + ph.weeks + ' 周</span>' : '') +
      '<span class="fact">今日打卡 <b>' + g.done + '</b>/' + g.total + '</span>' +
      '</div></div>' + ringHtml(pct, '今日完成', '#2f6feb') + '</div>' +

      '<div class="sub" style="margin-top:6px">' +

    h += '<div class="sec" style="margin-top:22px">' + secHead('四科今日', '点「本科详情」看知识点、课后题与单词设置') +
      '<div class="gcards">' + SUBJ_ORDER.map(function (p) { return todayCardHtml(todayOf(p)); }).join('') + '</div></div>';

    h += '<div class="card note" style="margin-top:16px"><b>怎么用</b><ul class="pts">' +
      '<li>这一页只做一件事：把今天每科该做的勾掉。</li>' +
      '<li>勾完不会自动跳到下一天：完成的那天会停住，点「下一天 →」再走。</li>' +
      '<li>「总体统计」看四科平均完成度与打卡日历；「阶段总览」看四科四段路线。</li>' +
      '</ul></div>';
    return h;
  }
  function todayCardHtml(t) {
    var p = t.p, data = t.data;
    var head = '<span class="badge subj c-' + p + '">' + SUBJ_FULL[p] + '</span>';
    if (t.notStarted) {
      return '<div class="gcard dim"><div class="row">' + head + '<span class="gt">还没启动</span>' +
        '<div class="grow"></div><span class="sub">' + data.startDate + ' 开始 · 还有 ' + t.wait + ' 天</span></div>' +
        '<div class="row" style="margin-top:8px"><span class="sub">' + esc(shortText(data.goal || '', 42)) + '</span>' +
        '<div class="grow"></div><button class="btn sm" data-gopen="' + p + '">看计划 →</button></div></div>';
    }
    if (t.over) {
      return '<div class="gcard dim"><div class="row">' + head + '<div class="grow"></div><span class="sub">计划已走完</span></div></div>';
    }

  function subjectStat(p) {
    var days = studyDays(p);
    var done = days.filter(function (d) { return isDoneOf(p, d); }).length;
    var map = checkinMap(p);
    var last7 = 0;
    for (var i = 0; i < 7; i++) {
      if (map[fmt(new Date(todayD().getTime() - i * 86400000))]) last7++;
    }
    var minutes = days.reduce(function (n, d) {
      var st = Pof(p).checks[d.id];
      return n + (st && st.done ? (d.minutes || 0) : 0);
    }, 0);
    return {
      p: p, total: days.length, done: done, pct: days.length ? Math.round(done / days.length * 100) : 0,
      map: map, last7: last7, minutes: minutes, phase: curPhaseOf(p), ch: chapterStatsOf(p), wr: wordRangeOf(p)
    };
  }
  function allCheckins() {
    var map = {};
    SUBJ_ORDER.forEach(function (p) {
      var m = checkinMap(p);
      Object.keys(m).forEach(function (k) { map[k] = (map[k] || 0) + m[k]; });
    });
    return map;
  }
  function activeDays(map) {
    return Object.keys(map).filter(function (k) { return map[k] > 0; }).length;
  }
  function longestStreak(map) {
    var keys = Object.keys(map).filter(function (k) { return map[k] > 0; }).sort();
    var best = 0, run = 0, prev = null;
    keys.forEach(function (k) {
      var d = dISO(k);
      run = (prev && diffDays(d, prev) === 1) ? run + 1 : 1;
      if (run > best) best = run;
      prev = d;
    });
    return best;
  }

      months += '<span>' + (mon.getMonth() !== lastM ? (mon.getMonth() + 1) + '月' : '') + '</span>';
      lastM = mon.getMonth();
      var col = '';
      for (var dow = 0; dow < 7; dow++) {
        var idx = w * 7 + dow;

      }

  function ganttHtml() {
    var base = null, end = null;
    SUBJ_ORDER.forEach(function (p) {
      var data = planOf(p);
      var s = dISO(data.startDate);
      if (!base || s < base) base = s;
      (data.phases || []).forEach(function (ph) {
        var e = dISO(ph.end);
        if (!end || e > end) end = e;
      });
    });
    if (!base || !end) return '<div class="empty">没有阶段数据。</div>';
    var exam = dISO(PLANS.math2.examDate);
    if (exam > end) end = exam;
    var span = diffDays(end, base) + 1;
    var nowLeft = Math.max(0, Math.min(100, diffDays(todayD(), base) / span * 100));

    var scale = '';
    var m = new Date(base.getFullYear(), base.getMonth(), 1), lastPos = -100;
    while (m <= end) {
      var pos = diffDays(m, base) / span * 100;
      if (pos < 0 && m.getFullYear() === base.getFullYear() && m.getMonth() === base.getMonth()) pos = 0;
      if (pos >= 0 && pos <= 100 && pos - lastPos > 4.2) {
        lastPos = pos;
        scale += '<span style="left:' + pos.toFixed(2) + '%">' + (m.getMonth() + 1) + '月</span>';
      }
      m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    }

    var rows = SUBJ_ORDER.map(function (p) {
      var data = planOf(p), color = SUBJ_COLOR[p];
      var blocks = (data.phases || []).map(function (ph) {
        var s = dISO(ph.start), e = dISO(ph.end);
        var left = diffDays(s, base) / span * 100;
        var w = (diffDays(e, s) + 1) / span * 100;
        var st = phaseState(ph);
        var style = 'left:' + left.toFixed(2) + '%;width:' + Math.max(w, 1.1).toFixed(2) + '%;';
        if (st === 'active') style += 'background:' + color + ';border-color:' + color + ';color:#fff;';
        else if (st === 'done') style += 'background:' + hexa(color, .42) + ';border-color:' + hexa(color, .42) + ';color:#fff;';
        else style += 'background:' + hexa(color, .13) + ';border-color:' + hexa(color, .3) + ';color:' + color + ';';
        return '<button type="button" class="gb" data-gblock="' + p + '|' + ph.id + '" style="' + style + '" title="' +
          esc(ph.name) + ' · ' + ph.start + ' → ' + ph.end + ' · ' + ph.weeks + ' 周">' +
          (w > 6 ? esc(ph.short) : '') + '</button>';
      }).join('');
      return '<div class="grow2"><div class="gl"><span class="dot" style="background:' + color + '"></span>' +
        SUBJ_FULL[p] + '</div><div class="track">' + blocks +
        '<span class="gnow" style="left:' + nowLeft.toFixed(2) + '%"></span></div></div>';
    }).join('');

    return '<div class="gantt"><div class="gantt-scale">' + scale + '</div>' + rows + '</div>';
  }

          s.at = fmt(todayD());
          pinDay(p, daysOf(p).indexOf(d));
          toast('已标记完成：' + shortText(d.title, 16) + '，点「下一天 →」继续');
        } else {
          s.done = false;
          delete s.at;
          toast('已取消完成：' + shortText(d.title, 16));
        }
        save();
        refresh();
      });
    });
    el.querySelectorAll('[data-daystep]').forEach(function (b) {
      b.addEventListener('click', function () { stepDay(p, +b.dataset.daystep); });
    });
    el.querySelectorAll('[data-daynext]').forEach(function (b) {
      b.addEventListener('click', function () { advanceDay(p); });
    });
    var auto = el.querySelector('[data-dayauto]');
    if (auto) auto.addEventListener('click', function () {
      unpinDay(p);
      save();
      render();
      scrollToSec('sec-day');
    });
  }
  function bindSubject(el) {
    var p = state.active, st = Pof(p);
    el.querySelectorAll('[data-subj]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.subj !== p) go('subject', b.dataset.subj);
      });
    });
    el.querySelectorAll('[data-mode]').forEach(function (b) {
      b.addEventListener('click', function () {
        st.mode = b.dataset.mode;
        unpinDay(p);
        save();
        refresh();
      });
    });
    var sd = el.querySelector('#startDate');
    if (sd) sd.addEventListener('change', function () {
      if (!sd.value) return;
      st.startDate = sd.value;
      unpinDay(p);
      save();
      refresh();
    });
    var rs = el.querySelector('#resetSubject');
    if (rs) {
      var armed = false, armTimer = null;
      var disarm = function () {
        armed = false;
        rs.textContent = '重置本科';
        rs.classList.remove('danger');
        clearTimeout(armTimer);
      };
      rs.addEventListener('click', function () {
        if (!armed) {
          armed = true;
          rs.textContent = '再点一次确认清空';
          rs.classList.add('danger');
          clearTimeout(armTimer);
          armTimer = setTimeout(disarm, 4000);
          return;
        }
        disarm();
        state.plans[p] = blank(p);
        save();
        refresh();
        toast('已重置「' + SUBJ_FULL[p] + '」的进度');
      });
    }
    el.querySelectorAll('[data-scroll]').forEach(function (b) {
      b.addEventListener('click', function () { scrollToSec(b.dataset.scroll); });
    });
    bindDaySection(el, p);
    bindWordTask(el);
    bindWordCard(el);
    bindChapters(el, p);
    bindWeeks(el, p);
    bindWrong(el, p);
    el.querySelectorAll('[data-hidx]').forEach(function (b) {
      b.addEventListener('click', function () {
        var idx = +b.dataset.hidx, list = daysOf(p);
        if (idx < 0 || idx >= list.length) return;
        pinDay(p, idx);
        save();
        render();
        scrollToSec('sec-day');
      });
    });
    var np = el.querySelector('[data-navphases]');
    if (np) np.addEventListener('click', function () { go('phases'); });
  }
  function bindView() {
    var el = document.getElementById('view');
    if (view === 'today') bindToday(el);
    else if (view === 'stats') bindStats(el);
    else if (view === 'phases') bindPhases(el);
    else bindSubject(el);
  }

  // ---------------- 启动 ----------------
  document.getElementById('nav').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-nav]');
    if (b) go(b.dataset.nav);
  });
  window.addEventListener('resize', syncStickyOffsets);
  window.addEventListener('hashchange', function () {
    view = readHash() || 'today';
    state.ui = {view: view, subject: state.active};
    save();
    render();
    applyPendingScroll();
  });
  document.getElementById('export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify({version: 3, exportedAt: new Date().toISOString(), state: state}, null, 2)], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'study-progress-' + fmt(new Date()) + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });
  document.getElementById('import').addEventListener('click', function () {
    document.getElementById('file').click();
  });
  document.getElementById('file').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        var s = d.state || d;
        if (s && s.plans && s.active && PLANS[s.active]) {
          state = normalize(s);
          state.ui = {view: view, subject: state.active};
          save();
          render();
          toast('已导入进度');
        } else {
          toast('导入失败：文件格式不对，需要本页导出的进度文件');
        }
      } catch (err) {
        toast('导入失败：不是合法的 JSON');
      }
    };
    r.readAsText(f);
    e.target.value = '';
  });

  document.getElementById('foot').innerHTML =
    '数据只存本机浏览器（localStorage），换设备用「导出」带走。' +
    ' 今日计划 = 四科合一的打卡清单；单科详情 = 每科一页的详细进程（今日明细 / 阶段 / 章节或单词 / 周次 / 日历 / 错题）。' +
    ' · v3 · 2026.11';

  // 隔天打开：昨天「固定在这一天」的记录自动放开，回到下一条没完成的学习日
  Object.keys(PLANS).forEach(function (p) {
    var st = state.plans[p];
    if (st && st.pinDate && st.pinDate !== fmt(todayD())) {
      st.pinDate = null;
      st.offset = null;
    }
  });

  var initView = readHash() || (state.ui && state.ui.view) || 'today';
  view = VIEWS.indexOf(initView) >= 0 ? initView : 'today';
  state.ui = {view: view, subject: state.active};
  save();
  if (!location.hash) {
    var h0 = '#/' + view + (view === 'subject' ? '/' + state.active : '');
    try {
      if (history.replaceState) history.replaceState(null, '', h0);
      else location.hash = h0;
    } catch (e) {
      location.hash = h0;
    }
  }
  render();
})();
</script>
</body>
</html>
