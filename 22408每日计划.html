<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>22408 · 每日计划</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#6b7280;
    --line:#e6e8ec; --accent:#2f6feb; --ok:#0e9f6e; --danger:#d92d20;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --subj:#2f6feb; --subj-weak:#eef3fe; --subj-line:#bcd0f7;
  }
  body[data-subject="math2"]{--subj:#2f6feb;--subj-weak:#eef3fe;--subj-line:#bcd0f7}
  body[data-subject="cs408"]{--subj:#0e9f6e;--subj-weak:#e7f6ef;--subj-line:#bfe6d4}
  body[data-subject="english"]{--subj:#d97706;--subj-weak:#fef3c7;--subj-line:#f3d18e}
  body[data-subject="politics"]{--subj:#d92d20;--subj-weak:#fee4e2;--subj-line:#f3c1be}
  /* 科目固定色（跨科目混排时用，不随当前科目变） */
  .c-math2{--sc:#2f6feb;--scw:#eef3fe}
  .c-cs408{--sc:#0e9f6e;--scw:#e7f6ef}
  .c-english{--sc:#d97706;--scw:#fef3c7}
  .c-politics{--sc:#d92d20;--scw:#fee4e2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 18px 64px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:.2px}
  h2{font-size:16px;margin:0 0 10px}
  h3{font-size:14px;margin:18px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.4px}
  .sub{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  .planbar{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
  .planbar button{border:0;background:transparent;font:inherit;font-size:16px;font-weight:600;color:var(--muted);
    padding:6px 2px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .planbar button.on{color:var(--text);border-bottom-color:var(--accent)}
  .planbar button.on[data-plan="math2"]{color:#2f6feb;border-bottom-color:#2f6feb}
  .planbar button.on[data-plan="cs408"]{color:#0e9f6e;border-bottom-color:#0e9f6e}
  .planbar button.on[data-plan="english"]{color:#d97706;border-bottom-color:#d97706}
  .planbar button.on[data-plan="politics"]{color:#d92d20;border-bottom-color:#d92d20}
  .badge.subj{background:var(--scw,#eef3fe);color:var(--sc,#2f6feb);font-weight:600}
  .badge.subj::before{content:'';display:inline-block;width:6px;height:6px;border-radius:99px;
    background:var(--sc,#2f6feb);margin-right:6px;vertical-align:1px}
  .planbar small{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:20px;line-height:1.35}
  .stat span{color:var(--muted);font-size:12px}
  .bar{height:6px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:var(--accent);width:0}
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;line-height:1.7;white-space:nowrap}
  .k-learn{background:#e8f0fe;color:#1a56db}
  .k-practice{background:#f1e9fe;color:#7c3aed}
  .k-review{background:#fff3e0;color:#b45309}
  .k-rest{background:#f2f4f7;color:#6b7280}
  .tabs{display:flex;gap:6px;margin:18px 0 12px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);font-size:14px;
    border:1px solid transparent;border-bottom:none}
  .tab.on{background:var(--card);color:var(--text);border-color:var(--line);font-weight:600}
  ul.pts{margin:6px 0 0;padding-left:20px}
  ul.pts li{margin:3px 0}
  .kv{display:flex;gap:10px;margin:10px 0;font-size:14px}
  .kv b{flex:0 0 52px;color:var(--muted);font-weight:500}
  label.check{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:9px;cursor:pointer;font-size:14px}
  label.check:hover{background:#f8f9fb}
  label.check input{margin-top:3px;accent-color:var(--ok);width:15px;height:15px;flex:0 0 auto}
  label.check.done span{color:#98a2b3;text-decoration:line-through}
  .ex{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin:10px 0;background:#fcfcfd}
  .ex .t{font-weight:600;font-size:14px;margin-bottom:4px}
  .ex .p{font-size:14px;white-space:pre-wrap;color:#333}
  .ex .hint{font-size:13px;color:var(--muted);margin-top:6px}
  .ex .ans{display:none;font-size:13.5px;background:#f4f7fb;border-left:3px solid var(--accent);
    padding:8px 10px;border-radius:6px;margin-top:8px;white-space:pre-wrap}
  .ex.open .ans{display:block}
  .btn{font:inherit;font-size:13.5px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:var(--text)}
  .btn:hover{border-color:#c9ced6}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{font-size:12.5px;padding:4px 9px}
  .btn.on{border-color:var(--danger);color:var(--danger)}
  .btn.sel{border-color:var(--accent);color:#1a56db;background:#eef3fe}
  .weeks{margin-top:6px}
  .wk{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:10px 0;overflow:hidden;box-shadow:var(--shadow)}
  .wk-h{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
  .wk-h .n{font-size:12px;color:var(--muted);flex:0 0 46px}
  .wk-h .ti{font-weight:600;font-size:14px;flex:1}
  .wk-b{padding:0 14px 14px;display:none}
  .wk.open .wk-b{display:block}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;cursor:pointer;background:#fff;min-height:74px;position:relative}
  .day:hover{border-color:#bfc6d1}
  .day .wd{color:var(--muted);font-size:11px}
  .day .tt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;line-height:1.45}
  .day .dot{position:absolute;right:8px;top:9px;width:7px;height:7px;border-radius:99px;background:#e2e6eb}
  .day.done .dot{background:var(--ok)}
  .day.rest{background:#fafbfc;color:#98a2b3}
  .ck{display:inline-block;margin:0 0 8px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;
    background:#fff7e6;color:#a66a00;border:1px solid #ffe0a3}
  .empty{padding:26px;text-align:center;color:var(--muted)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .seg button{border:0;background:transparent;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:#eef3fe;color:#1a56db;font-weight:600}
  input[type=date]{font:inherit;font-size:13.5px;padding:5px 8px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .split{height:1px;background:var(--line);margin:14px 0}
  .list-prog{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:6px}
  .lp{font-size:13px}
  .lp .h{display:flex;justify-content:space-between;margin-bottom:4px}
  .wrong{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#fff;box-shadow:var(--shadow)}
  .wrong .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .wrong .head .t{font-weight:600;font-size:14px}
  .wrong .prompt{font-size:13.5px;color:#333;white-space:pre-wrap;margin-top:8px}
  .wrong textarea{width:100%;margin-top:10px;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);
    border-radius:9px;resize:vertical;min-height:56px;background:#fcfcfd}
  .wrong.mastered{opacity:.62}
  .wrong .meta{font-size:12px;color:var(--muted)}
  .phases{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .ph{flex:1 1 150px;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fbfcfd;
    cursor:pointer;font:inherit;text-align:left;color:var(--text);display:block}
  .ph:hover{border-color:#c9ced6;background:#f7f9fc}
  .ph.on{border-color:var(--subj);background:var(--subj-weak)}
  .ph.done{background:#f8fbfa}
  .ph .n{display:block;font-size:11px;color:var(--muted)}
  .ph .t{display:block;font-size:13.5px;font-weight:600;margin-top:2px}
  .ph .d{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
  .ph .pw{display:block;height:5px;background:#e9ecf1;border-radius:99px;overflow:hidden;margin-top:8px}
  .ph .pw>i{display:block;height:100%;background:var(--ok)}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:#eef3fe;color:#1a56db;white-space:nowrap}
  .pill.ok{background:#e7f6ef;color:#0e9f6e}
  .pill.wait{background:#f2f4f7;color:#6b7280}
  .phc{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:16px 18px;margin:12px 0}
  .phc.on{border-color:#bcd0f7}
  .phc-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .phc-h h2{margin:0}
  .phc .dates{font-size:12.5px;color:var(--muted);margin-top:4px}
  .ml{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:13.5px}
  .ml:first-of-type{border-top:0}
  .ml>b{flex:0 0 128px;font-size:13px;font-weight:600}
  .ml>b small{color:var(--muted);font-weight:400;margin-left:6px}
  .ml>span{flex:1;color:#333}
  .phc .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.4px;margin:15px 0 4px}
  .blk{display:flex;gap:10px;font-size:13px;padding:5px 0;border-top:1px dashed #eef0f3}
  .blk:first-of-type{border-top:0}
  .blk>b{flex:0 0 128px;font-weight:500}
  .blk>.c{flex:1;color:var(--muted)}
  .blk.detail>b{color:var(--accent)}
  .ckp{display:flex;gap:10px;font-size:13px;padding:4px 0;align-items:flex-start}
  .ckp .dt{flex:0 0 78px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .gcards .gcard{margin:0}
  .today-wrap{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:14px;align-items:start}
  .today-side{display:flex;flex-direction:column;gap:12px}
  .today-side .card,.today-side .wordcard{margin:0}
  .side-card{border-radius:14px}
  .chapters{margin-top:8px}
  .chapgroup{border-top:1px dashed var(--line);padding:4px 0}
  .chapgroup:first-child{border-top:0}
  .chapgroup summary{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;
    font-weight:600;color:#374151;padding:4px 0;list-style:none}
  .chapgroup summary>span:first-of-type{flex:1}
  .chapgroup summary::-webkit-details-marker{display:none}
  .chapgroup summary::before{content:'▸';color:var(--muted);margin-right:6px;font-size:11px}
  .chapgroup[open] summary::before{content:'▾'}
  .chap{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0 3px 16px;border-radius:6px}
  .chap input{width:14px;height:14px;accent-color:var(--ok);flex:0 0 auto}
  .chap.done span{color:#98a2b3;text-decoration:line-through}
  .chapters.wide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
  .chapters.wide .chapgroup{border:1px solid var(--line);border-radius:10px;padding:4px 10px 6px;border-top:1px solid var(--line)}
  @media (max-width:760px){.chapters.wide{grid-template-columns:1fr}}
  .heat-wrap{overflow-x:auto;padding:2px 0 6px}
  .heat{display:inline-flex;gap:3px;align-items:flex-start}
  .heat .hcol{display:grid;grid-template-rows:repeat(7,12px);gap:3px}
  .heat .hd{width:12px;height:12px;border-radius:3px;background:#eef0f3;border:0;padding:0;cursor:pointer}
  .heat .hd.off{background:transparent;cursor:default}
  .heat .hd.lv1{background:var(--subj);opacity:.25}
  .heat .hd.lv2{background:var(--subj);opacity:.45}
  .heat .hd.lv3{background:var(--subj);opacity:.7}
  .heat .hd.lv4{background:var(--subj);opacity:1}
  .heat .hd.today{outline:2px solid var(--subj);outline-offset:1px}
  .heat .hd:hover{outline:1px solid #94a3b8;outline-offset:1px}
  .heat-months{display:flex;gap:3px;font-size:10.5px;color:var(--muted);margin-bottom:4px}
  .heat-months span{width:13px;flex:0 0 13px;overflow:visible;white-space:nowrap}
  .heat-legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:6px}
  .heat-row{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
  .heat-stats{display:flex;gap:26px;padding-top:18px}
  .heat-stats b{display:block;font-size:20px;line-height:1.2;color:var(--text);font-variant-numeric:tabular-nums}
  .heat-stats span{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .heat .hd{width:13px;height:13px}
  .heat .hcol{grid-template-rows:repeat(7,13px)}
  .heat-legend i{width:11px;height:11px;border-radius:3px;background:var(--subj);display:inline-block}
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
    background:#111827;color:#fff;font-size:13px;padding:10px 14px;border-radius:11px;display:flex;gap:16px;
    align-items:center;box-shadow:0 12px 32px rgba(15,23,42,.22);transition:opacity .18s,transform .18s;z-index:99}
  #toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #toast button{background:none;border:0;color:#7dd3fc;font:inherit;cursor:pointer;padding:0}
  #toast button:hover{text-decoration:underline}
  .gcard{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:14px 16px;margin:10px 0}
  .gcard .badge{margin-right:2px}
  .gcard.dim{opacity:.66}
  .gcard .gt{font-size:14px;font-weight:600}
  .gcard .gword{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
  .gcard .gword .bar{min-width:80px}
  .wordcard{border:1px solid #d7e3fa;background:#f7faff;border-radius:12px;padding:13px 14px;margin:12px 0 6px}
  .wordcard input[type=number]{width:78px;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);
    border-radius:8px;background:#fff}
  .wordcard .bar{margin-top:8px}
  .wordcard .bar>i{background:linear-gradient(90deg,#2f6feb,#4f9bff)}
  .pseg{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
  .pseg-b{border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;
    font-size:13px;color:var(--muted);padding:7px 12px;line-height:1.4;text-align:left}
  .pseg-b:hover{border-color:#c9ced6;background:#f8fafc}
  .pseg-b.on{background:#eef3fe;border-color:#bcd0f7;color:#1a56db;font-weight:600}
  .pseg-b.done{color:#0e9f6e;border-color:#cfe9dd}
  .pseg-b small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
  .pnav{display:flex;gap:8px;align-items:center;margin:10px 0 0}
  .pnav .btn{font-size:13px}
  .phase-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:22px 0 2px}
  .phase-h h2{margin:0;font-size:15px}
  .wk.skel{box-shadow:none;background:#fbfcfd;border-style:dashed}
  .skel-h{display:flex;gap:10px;padding:9px 14px;font-size:12.5px;align-items:baseline;flex-wrap:wrap}
  .skel-h .n{flex:0 0 146px;color:var(--muted)}
  .skel-h .c{flex:1;color:#4b5563}
  footer{margin-top:26px;color:#9aa2b1;font-size:12px;text-align:center}
  @media (max-width:1040px){
    .gcards{grid-template-columns:1fr}
    .today-wrap{grid-template-columns:1fr}
  }
  @media (max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .days{grid-template-columns:repeat(2,1fr)}
    .list-prog{grid-template-columns:1fr}
    .ml>b,.blk>b{flex-basis:96px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="planbar" id="planbar"></div>
    <h1 id="title">22408 · 每日计划</h1>
    <div class="sub" id="meta"></div>
    <div class="row" style="margin-top:12px">
      <div class="seg" id="mode">
        <button data-mode="progress" class="on">按进度推荐</button>
        <button data-mode="date">按日历</button>
      </div>
      <div class="grow"></div>
      <span class="sub" id="startLabel">开始日期</span>
      <input type="date" id="start">
      <button class="btn" id="export">导出</button>
      <button class="btn" id="import">导入</button>
      <button class="btn ghost" id="reset">重置本科</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
    <div class="phases" id="phases"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <div class="tab on" data-view="plan">今日计划</div>
    <div class="tab" data-view="today">单科今日</div>
    <div class="tab" data-view="phase">阶段</div>
    <div class="tab" data-view="weeks">全部周次</div>
    <div class="tab" data-view="stats">进度统计</div>
    <div class="tab" data-view="wrong">错题本</div>
  </div>

  <div id="view"></div>

<script id="plan-math2" type="application/json">{"id":"math2-2028","title":"数学二 全年计划 · 四阶段（细化到第 12 周）","subject":"数学二","level":"零基础起步（高数、线代从教材开始）","goal":"完成数二基础一轮（12 周）：高数 7 周 + 线代 5 周，阶段测一/二/三达标，期末 150 分总测 ≥100","tools":"武忠祥《高等数学辅导讲义》、李永乐《线性代数辅导讲义》、660 题（只做基础篇）、错题本","dailyMinutes":120,"startDate":"2026-11-09","source":{"note":"由 rebuild_app_plan.py 按 12 周基础期重排；章节正文沿用第 1 版权威内容，按 Excel v2 的周次地图重新归周"},"weeks":[{"week":1,"title":"函数、极限与连续","goal":"极限限时 30 题正确率 ≥85%；可导/连续关系辨析 5 题全对；660 题 30 道完成","target":"660 题 30 道 + 讲义例题 20 道","check":"","days":[{"id":"w1d1","weekday":"周一","title":"函数与数列极限：ε–N 定义","minutes":120,"kind":"learn","learn":["函数四性：有界、单调、奇偶、周期；复合与反函数","数列极限的 ε–N 定义","收敛数列的性质：唯一性、有界性、保号性"],"reading":"武忠祥讲义 第 1 章（同济 1.1–1.2）","practice":["用 ε–N 定义证明 lim(n→∞) 1/n = 0","判断 f(x)=x·sin(1/x) 在 (0,1) 上是否有界，并说明理由"],"exercises":[{"id":"w1d1e1","title":"用定义证明 (2n+1)/(n+3) → 2","prompt":"用 ε–N 语言证明 lim(n→∞) (2n+1)/(n+3) = 2。\n验收：写清对任意 ε>0 如何取 N。","hint":"先做差并通分，把 |a_n − 2| 放缩成只含 n 的式子。","answer":"|(2n+1)/(n+3) − 2| = |−5|/(n+3) = 5/(n+3)。要它 < ε，只需 n+3 > 5/ε，取 N = ⌈5/ε⌉ 即可。关键点在通分后分子是常数，放缩才干净。","difficulty":1},{"id":"w1d1e2","title":"有界但不收敛","prompt":"举一个数列：有界但发散，并证明它发散。\n验收：写出通项与发散理由。","hint":"用摆动数列，取两个不同的极限点。","answer":"取 a_n = (−1)^n，|a_n| ≤ 1 有界；但偶数项趋于 1、奇数项趋于 −1，两个子列极限不同，故发散。","difficulty":1}],"checklist":["能默写 ε–N 定义","能独立完成 1 个 ε–N 证明","能举出有界但不收敛的数列"]},{"id":"w1d3","weekday":"周二","title":"函数极限、无穷小与极限运算法则","minutes":120,"kind":"learn","learn":["x→x₀ 的 ε–δ 定义与 x→∞ 的 X 定义","无穷小与无穷大的关系","极限四则运算与复合函数极限"],"reading":"武忠祥讲义 第 1 章（同济 1.3–1.5）","practice":["10 道基础极限计算，含根式有理化与分式约零因子","把 5 个无穷小按阶排序"],"exercises":[{"id":"w1d3e1","title":"根式有理化","prompt":"求 lim(x→0) (√(1+x) − 1)/x。\n验收：写出分子有理化过程。","hint":"分子分母同乘 √(1+x)+1。","answer":"原式 = lim x/[x(√(1+x)+1)] = lim 1/(√(1+x)+1) = 1/2。也可直接用等价无穷小 √(1+x)−1 ~ x/2。","difficulty":1}],"checklist":["能说清 ε–δ 与 ε–N 的差别","会做根式有理化","10 道基础题错 ≤1"]},{"id":"w1d5","weekday":"周三","title":"两个重要极限与无穷小比较","minutes":120,"kind":"practice","learn":["lim(sin x)/x = 1 与 lim(1+1/x)^x = e","等价无穷小表与替换条件","夹逼准则与单调有界准则"],"reading":"武忠祥讲义 第 1 章（同济 1.6–1.7）","practice":["夹逼法证明 lim n(1/√(n²+1) + … + 1/√(n²+n)) 的极限","20 道等价无穷小替换计算"],"exercises":[{"id":"w1d5e1","title":"1−cos x 的阶","prompt":"求 lim(x→0) (1−cos x)/x²，并说明 1−cos x 是 x 的几阶无穷小。\n验收：写出替换依据。","hint":"1−cos x = 2sin²(x/2)，或直接用 1−cos x ~ x²/2。","answer":"原式 = lim (x²/2)/x² = 1/2，故 1−cos x 与 x 同阶（二阶无穷小）。注意替换后仍是「乘除因子」才合法。","difficulty":1},{"id":"w1d5e2","title":"夹逼","prompt":"求 lim(n→∞) (1/√(n²+1) + 1/√(n²+2) + … + 1/√(n²+n))。\n验收：写出上下界。","hint":"共 n 项，每项介于 1/√(n²+n) 与 1/√(n²+1) 之间。","answer":"记 S_n，则 n/√(n²+n) ≤ S_n ≤ n/√(n²+1)。两端极限都是 1，故原式 = 1。","difficulty":2}],"checklist":["能默写 6 个常用等价无穷小","能说明「只因子可替换、加减项不可随意替换」","夹逼题独立完成 2 道"]},{"id":"w2d1","weekday":"周四","title":"连续性与间断点","minutes":120,"kind":"learn","learn":["连续定义：左连续、右连续、区间连续","间断点分类：可去、跳跃、无穷、振荡"],"reading":"武忠祥讲义 第 1 章（同济 1.8–1.9）","practice":["判断 6 个函数的间断点并分类","求使函数在分段点连续时的参数"],"exercises":[{"id":"w2d1e1","title":"参数使连续","prompt":"设 f(x) = (e^x − 1)/x (x≠0)，f(0)=a，求 a 使 f 在 x=0 连续。\n验收：写出极限过程。","hint":"连续要求 a = lim(x→0) f(x)。","answer":"lim(x→0)(e^x−1)/x = 1（等价无穷小 e^x−1 ~ x），故 a = 1。","difficulty":1}],"checklist":["4 类间断点的判别顺序说得清","分段点连续性必须算左右极限","10 道分类题全对"]},{"id":"w2d3","weekday":"周五","title":"闭区间连续函数的性质","minutes":120,"kind":"learn","learn":["有界性与最大值最小值定理","零点定理与介值定理"],"reading":"武忠祥讲义 第 1 章（同济 1.10）","practice":["用零点定理证明方程在给定区间有根","用介值定理证明存在性命题 2 道"],"exercises":[{"id":"w2d3e1","title":"零点定理","prompt":"证明方程 x³ − 4x² + 1 = 0 在区间 (0,1) 内至少有一个根。\n验收：写出函数取值与定理引用。","hint":"令 f(x)=x³−4x²+1，算 f(0)、f(1)，一正一负即可。","answer":"f(0)=1>0，f(1)=−2<0，f 在 [0,1] 连续，由零点定理存在 ξ∈(0,1) 使 f(ξ)=0。","difficulty":1}],"checklist":["三条定理的条件（闭区间、连续）能说全","证明题会写「令 F(x)=…，F 连续」","独立完成 2 道存在性证明"]},{"id":"w2d5","weekday":"周六","title":"第 1 章自测与错题","minutes":120,"kind":"practice","learn":["第 1 章知识框架回顾：定义 → 计算 → 连续","极限计算的三条主线：等价替换、洛必达、泰勒"],"reading":"第 1 章课后题未做部分 + 错题本","practice":["限时 40 分钟做 15 道自测题（选择 8 + 计算 7）","错题按「概念错 / 计算错 / 方法错」归类"],"exercises":[{"id":"w2d5e1","title":"自测代表题","prompt":"求 lim(x→0) (tan x − sin x)/x³。\n验收：给出泰勒或等价替换的完整推导。","hint":"tan x − sin x = sin x(1−cos x)/cos x。","answer":"原式 = lim [sin x(1−cos x)]/(x³ cos x) = lim (x · x²/2)/(x³) = 1/2。用「先提公因式再替换」可避免加减项替换的错误。","difficulty":2}],"checklist":["自测正确率 ≥80%","每道错题写明错因","能口述第 1 章的 5 个核心结论"]},{"id":"w1_review","weekday":"周日","title":"第 1 周复盘：极限与连续的错题重做","minutes":60,"kind":"review","learn":[],"reading":"错题本 + 本周王道/讲义章节","practice":["重做本周错题","核对另一科目本周进度"],"exercises":[],"checklist":["极限等价替换不再混用加减法","间断点分类能一次说全","错题本已登记"]}],"phase":"p1"},{"week":2,"title":"导数与微分 + 微分中值定理","goal":"中值定理证明 8 题独立完成 ≥6；求导法则不查书；660 题 40 道","target":"660 题 40 道 + 中值定理证明 8 道","check":"","days":[{"id":"w3d1","weekday":"周一","title":"导数定义与可导性","minutes":120,"kind":"learn","learn":["导数定义式与几何意义（切线斜率）","左右导数与可导的充要条件","可导必连续，反之不成立"],"reading":"武忠祥讲义 第 2 章（同济 2.1）","practice":["用定义求 3 个函数在指定点的导数","判断分段函数在分界点是否可导"],"exercises":[{"id":"w3d1e1","title":"定义判可导","prompt":"设 f(x)=x²sin(1/x) (x≠0)，f(0)=0。判断 f 在 x=0 是否可导。\n验收：用定义写出极限。","hint":"写出 [f(0+h)−f(0)]/h，再看 h→0 的极限。","answer":"[f(h)−f(0)]/h = h·sin(1/h) → 0（有界量乘无穷小），故 f'(0)=0，可导。注意 |x| 在 0 处左右导数不等，是连续但不可导的反例。","difficulty":2}],"checklist":["定义式能默写并能凑出 f(x₀+Δx)−f(x₀)","分界点必须分别算左右导数","能举出连续但不可导的例子"]},{"id":"w3d3","weekday":"周二","title":"求导法则与复合函数","minutes":120,"kind":"learn","learn":["四则运算、复合函数链式法则","反函数求导与基本导数表","高阶导数的递推与莱布尼茨公式"],"reading":"武忠祥讲义 第 2 章（同济 2.2–2.3）","practice":["20 道复合求导，含 e^sin x、ln(cos 2x) 一类","求 y=x²e^x 的 n 阶导数（莱布尼茨）"],"exercises":[{"id":"w3d3e1","title":"多层复合","prompt":"求 y = ln(cos(e^x)) 的导数。\n验收：写出每一层的中间变量。","hint":"由外到内：ln u → cos v → e^x。","answer":"y' = [1/cos(e^x)]·(−sin(e^x))·e^x = −e^x·tan(e^x)。","difficulty":1}],"checklist":["链式法则不丢层","基本导数表全默写","20 题错 ≤2"]},{"id":"w3d5","weekday":"周三","title":"隐函数、参数方程与微分","minutes":120,"kind":"practice","learn":["隐函数求导：两边对 x 求导后解出 y'","参数方程 dy/dx = (dy/dt)/(dx/dt)","一阶微分形式不变性"],"reading":"武忠祥讲义 第 2 章（同济 2.4–2.5）","practice":["x²+y²=1 求 y''（用隐函数法）","参数方程 x=t−sin t, y=1−cos t 求 dy/dx 与 d²y/dx²"],"exercises":[{"id":"w3d5e1","title":"参数方程二阶导","prompt":"x = t − sin t, y = 1 − cos t，求 dy/dx 与 d²y/dx²。\n验收：写出两次求导过程。","hint":"先求 dy/dt 与 dx/dt，再相除；二阶导 = d(dy/dx)/dt ÷ dx/dt。","answer":"dy/dx = sin t/(1−cos t) = cot(t/2)。再对 t 求导得 −(1/2)csc²(t/2)，除以 dx/dt=1−cos t=2sin²(t/2)，得 d²y/dx² = −1/(4sin⁴(t/2)) = −1/(1−cos t)²。关键是二阶导要再除一次 dx/dt。","difficulty":3}],"checklist":["隐函数二阶导不混 y'","参数方程二阶导要再除一次 dx/dt","微分式 dy = f'(x)dx 会用"]},{"id":"w4d1","weekday":"周四","title":"罗尔、拉格朗日、柯西中值定理","minutes":120,"kind":"learn","learn":["三定理的条件与结论","辅助函数构造：F(x)=f(x)e^{g(x)} 型","用中值定理证不等式与等式"],"reading":"武忠祥讲义 第 2 章（同济 3.1）","practice":["用罗尔定理证明 f'(ξ)=0 类命题 2 道","构造辅助函数证明 f(b)−f(a) 型等式"],"exercises":[{"id":"w4d1e1","title":"构造辅助函数","prompt":"设 f 在 [0,1] 连续、(0,1) 可导，f(0)=f(1)=0。证明存在 ξ∈(0,1) 使 f'(ξ)=f(ξ)。\n验收：写出辅助函数并验证条件。","hint":"把 f'−f=0 看成 (e^{−x}f(x))'=0。","answer":"令 F(x)=e^{−x}f(x)，F(0)=F(1)=0，F 在 [0,1] 连续、(0,1) 可导，由罗尔定理存在 ξ 使 F'(ξ)=e^{−ξ}[f'(ξ)−f(ξ)]=0，即 f'(ξ)=f(ξ)。","difficulty":3}],"checklist":["三定理条件差异说得清（端点值、开闭区间）","辅助函数能自己想出来","独立完成 2 道证明"]},{"id":"w4d3","weekday":"周五","title":"洛必达法则与泰勒公式","minutes":120,"kind":"learn","learn":["0/0 与 ∞/∞ 型的洛必达使用条件","泰勒公式：佩亚诺余项与拉格朗日余项","e^x、sin x、cos x、ln(1+x)、(1+x)^α 的展开"],"reading":"武忠祥讲义 第 2 章（同济 3.2–3.3）","practice":["用泰勒展开求 3 个极限（含 x−sin x、e^x−1−x）","写出 ln(1+x) 到 x³ 的展开式"],"exercises":[{"id":"w4d3e1","title":"泰勒求极限","prompt":"求 lim(x→0) (x − sin x)/x³。\n验收：写出 sin x 的展开与截断。","hint":"sin x = x − x³/6 + o(x³)。","answer":"原式 = lim (x³/6 + o(x³))/x³ = 1/6。泰勒的优势是能直接看出阶数，洛必达要连求三次。","difficulty":2}],"checklist":["洛必达前先验证类型与条件","5 个常用展开默写","能判断该用泰勒还是洛必达"]},{"id":"w4d5","weekday":"周六","title":"单调性、极值、凹凸与渐近线","minutes":120,"kind":"practice","learn":["f' 符号与单调区间","极值第一、第二充分条件","f'' 与凹凸、拐点；三类渐近线"],"reading":"武忠祥讲义 第 2 章（同济 3.4–3.6）","practice":["作一个有理函数的完整图像（定义域、单调、极值、凹凸、渐近线）","求 3 个函数的渐近线"],"exercises":[{"id":"w4d5e1","title":"渐近线","prompt":"求曲线 y = (x²+1)/(x−1) 的所有渐近线。\n验收：分别说明垂直、水平、斜渐近线的判定。","hint":"垂直看分母零点；斜渐近线算 k=lim y/x、b=lim(y−kx)。","answer":"x=1 为垂直渐近线；k=1、b=1，故 y=x+1 为斜渐近线；无水平渐近线。","difficulty":2}],"checklist":["列表法作图步骤完整","极值点与拐点不混淆","三类渐近线都会求"]},{"id":"w2_review","weekday":"周日","title":"第 2 周复盘：求导与中值定理","minutes":60,"kind":"review","learn":[],"reading":"错题本 + 本周王道/讲义章节","practice":["重做本周错题","核对另一科目本周进度"],"exercises":[],"checklist":["罗尔/拉格朗日/柯西的适用条件不混","构造辅助函数有套路","错题本已登记"]}],"phase":"p1"},{"week":3,"title":"导数应用收尾 + 不定积分","goal":"不等式证明 5 题全对；积分专项 40 题 ≥85%；660 题 60 道","target":"660 题 60 道（积分 40）","check":"","days":[{"id":"w5d1","weekday":"周一","title":"不等式证明与方程根的个数","minutes":120,"kind":"learn","learn":["用单调性证不等式","用最值证不等式","用零点定理 + 单调性数根"],"reading":"武忠祥讲义 第 2 章（同济 3.4–3.5 及课后题）","practice":["证明 x>0 时 ln(1+x) < x","讨论 x³−3x+a=0 的实根个数"],"exercises":[{"id":"w5d1e1","title":"根的个数","prompt":"讨论方程 x³ − 3x + a = 0 的实根个数（按 a 分类）。\n验收：写出单调区间与极值。","hint":"求 f'=3x²−3，得 x=±1，比较极值与 0。","answer":"f 在 (−∞,−1) 增、(−1,1) 减、(1,+∞) 增；极大 f(−1)=a+2，极小 f(1)=a−2。a+2<0 或 a−2>0 时 1 个根；a=±2 时 2 个根；−2<a<2 时 3 个根。","difficulty":3}],"checklist":["证不等式先移项构造 F(x)","数根 = 单调区间数 + 端点符号","两类题各独立完成 2 道"]},{"id":"w5d3","weekday":"周二","title":"曲率与第 2–3 章综合","minutes":120,"kind":"learn","learn":["曲率与曲率半径公式（低频，了解即可）","导数应用题的识别：见到「证明存在 ξ」想中值定理，见到「恒成立」想最值"],"reading":"第 2–3 章综合题","practice":["做 6 道综合题（中值定理 2、不等式 2、图像 2）","整理导数一章的公式卡"],"exercises":[{"id":"w5d3e1","title":"综合判断","prompt":"设 f 在 [a,b] 上二阶可导，f(a)=f(b)=0，f'(a)>0。证明存在 ξ 使 f''(ξ)<0。\n验收：说明用了哪个定理、辅助函数是什么。","hint":"先由 f'(a)>0 与 f(b)=0 推出存在 c 使 f(c)>0，再对 [a,c]、[c,b] 用中值定理。","answer":"因 f(a)=0、f'(a)>0，存在 c∈(a,b) 使 f(c)>0；对 [a,c] 与 [c,b] 分别用拉格朗日定理得两点导数异号，再用一次中值定理（或达布定理）得 f''(ξ)<0。","difficulty":3}],"checklist":["曲率公式能查能用","综合题能判断该用哪类工具","公式卡整理完"]},{"id":"w5d5","weekday":"周三","title":"第 2–3 章自测与错题","minutes":120,"kind":"practice","learn":["导数与微分、中值定理、应用三块框架回顾","自测节奏：先限时通做，再逐题对答案并归因"],"reading":"错题本 + 课后题","practice":["限时 60 分钟做 12 道自测（求导 4、中值定理 3、应用 5）","错题重做并标注卡点"],"exercises":[{"id":"w5d5e1","title":"自测代表题","prompt":"求 f(x)=x·e^{−x} 的单调区间、极值与最大值。\n验收：写出 ,y)dx。","difficulty":2}],"checklist":["能由限反画区域","交换后区域不变","6 题错 ≤2"]},{"id":"w12d1","weekday":"周四","title":"二重积分综合题","minutes":120,"kind":"learn","learn":["分片区域上的积分","利用对称性化简复杂被积函数","二重积分与一元积分的转换"],"reading":"第 10 章综合题","practice":["做 6 道综合题","总结「先判对称、再选坐标、最后定限」的流程"],"exercises":[{"id":"w12d1e1","title":"对称性化简","prompt":"计算 ∫∫_D (x+y)²dσ，D：x²+y²≤1。\n验收：展开后说明哪项为零。","hint":"(x+y)² = x²+2xy+y²，2xy 关于 y 是奇函数。","answer":"2xy 在对称区域积分为 0，故原式 = ∫∫(x²+y²)dσ = ∫₀^{2π}dθ∫₀¹r³dr = 2π/4 = π/2。","difficulty":3}],"checklist":["流程能口述","综合题步骤完整","6 题独立完成"]},{"id":"w12d3","weekday":"周五","title":"重积分自测","minutes":120,"kind":"learn","learn":["自测范围：直角坐标、极坐标、交换次序、对称性","自测节奏：先限时通做，再逐题对答案并归因"],"reading":"第 10 章自测","practice":["限时 50 分钟做 10 道题","对照答案逐题标错因"],"exercises":[{"id":"w12d3e1","title":"自测代表题","prompt":"计算 ∫∫_D x dσ，D：x²+y²≤2x。\n验收：先配方再选坐标。","hint":"配方 (x−1)²+y²≤1，极坐标下 0≤r≤2cosθ，−π/2≤θ≤π/2。","answer":"= ∫_{−π/2}^{π/2}dθ∫₀^{2cosθ} r cosθ·r dr = (8/3)∫_{−π/2}^{π/2}cos⁴θ dθ = (8/3)·(3π/8) = π。","difficulty":3}],"checklist":["自测正确率 ≥75%","极坐标零错误","错因分类完成"]},{"id":"w12d5","weekday":"周六","title":"重积分错题回炉","minutes":120,"kind":"practice","learn":["错题按「限写错 / 坐标选错 / 对称性没看出来」归类","重做纪律：不看答案、限时完成，二次仍错按概念问题处理"],"reading":"错题本","practice":["重做本周全部错题","整理二重积分公式卡"],"exercises":[{"id":"w12d5e1","title":"错题重做","prompt":"重做本周做错的两道题，要求不看答案、写出完整步骤。\n验收：步骤与答案都对。","hint":"先复述当时错在哪一步，再动笔。","answer":"以你实际错题为准，写完后对照原答案检查限是否一致。","difficulty":2}],"checklist":["错题二次正确率 ≥90%","公式卡完成","能默写极坐标变换"]},{"id":"w6_review","weekday":"周日","title":"第 6 周复盘：二重积分","minutes":60,"kind":"review","learn":[],"reading":"错题本 + 本周王道/讲义章节","practice":["重做本周错题","核对另一科目本周进度"],"exercises":[],"checklist":["换序先画区域再写限","极坐标雅可比 r 不丢","错题本已登记"]}],"phase":"p1"},{"week":7,"title":"常微分方程 + 阶段测二","goal":"高数下 100 分卷 ≥75；一阶线性通解不查书；二阶常系数 10 题全对","target":"660 题 20 道 + 阶段测 1 套","check":"检查点 2：高数下 100 分卷 ≥75","days":[{"id":"w13d1","weekday":"周一","title":"基本概念与可分离变量方程","minutes":120,"kind":"learn","learn":["阶、通解、特解、初始条件","可分离变量方程的解法","齐次方程的变量代换 u=y/x"],"reading":"武忠祥讲义 第 2 章（同济 7.1–7.2）","practice":["解 6 道可分离变量方程","解 3 道齐次方程"],"exercises":[{"id":"w13d1e1","title":"可分离变量","prompt":"解 y' = xy，y(0)=1。\n验收：写出分离、积分、代初值三步。","hint":"dy/y = x dx。","answer":"ln|y| = x²/2 + C，y = Ce^{x²/2}；由 y(0)=1 得 C=1，故 y = e^{x²/2}。","difficulty":1}],"checklist":["解完记得代回验证","齐次方程令 u=y/x 后能化可分离","9 题错 ≤2"]},{"id":"w13d3","weekday":"周二","title":"一阶线性方程与可降阶方程","minutes":120,"kind":"learn","learn":["一阶线性：y'+P(x)y=Q(x) 的常数变易/公式法","可降阶：y''=f(x)、y''=f(x,y')、y''=f(y,y')"],"reading":"武忠祥讲义 第 2 章（同济 7.3–7.4）","practice":["解 8 道一阶线性方程","解 4 道可降阶方程"],"exercises":[{"id":"w13d3e1","title":"一阶线性","prompt":"解 y' + y = e^{−x}，y(0)=0。\n验收：写出积分因子或公式。","hint":"P=1，Q=e^{−x}，积分因子 e^x。","answer":"两边乘 e^x：(ye^x)' = 1，故 y e^x = x + C，y = (x+C)e^{−x}；由 y(0)=0 得 C=0，y = x e^{−x}。","difficulty":2}],"checklist":["公式法系数不写错","可降阶要先做代换降阶","12 题错 ≤3"]},{"id":"w13d5","weekday":"周三","title":"微分方程习题与建模","minutes":120,"kind":"practice","learn":["由实际问题列方程（增长、冷却、几何）","解的存在唯一性（了解）"],"reading":"武忠祥讲义 第 2 章（同济 7.5 及综合题）","practice":["做 5 道应用题","整理一阶方程的识别流程图"],"exercises":[{"id":"w13d5e1","title":"建模","prompt":"某物质按比例衰减，初始 100 g，10 小时后剩 50 g，求 20 小时后剩余量。\n验收：先列方程再解。","hint":"dm/dt = −km，m(0)=100。","answer":"m=100e^{−kt}，由 m(10)=50 得 e^{−10k}=1/2，故 m(20)=100·(1/2)²=25 g。","difficulty":2}],"checklist":["能判断用哪类解法","流程图画完","应用题列式正确"]},{"id":"w14d1","weekday":"周四","title":"二阶常系数齐次线性方程","minutes":120,"kind":"learn","learn":["特征方程与三种根情形（相异实根、重根、共轭复根）","通解写法"],"reading":"武忠祥讲义 第 2 章（同济 7.6）","practice":["解 8 道齐次方程","由通解反推方程"],"exercises":[{"id":"w14d1e1","title":"复根","prompt":"解 y'' + 4y = 0。\n验收：写出特征根与通解。","hint":"r²+4=0，r=±2i。","answer":"y = C₁cos2x + C₂sin2x。注意复根时用三角函数而非指数。","difficulty":1}],"checklist":["三种情形通解默写","复根情形系数对","8 题错 ≤1"]},{"id":"w14d3","weekday":"周五","title":"二阶常系数非齐次线性方程","minutes":120,"kind":"learn","learn":["特解形式：自由项为 P_m(x)e^{λx} 时设 x^k Q_m(x)e^{λx}","叠加原理","常数变易法（了解）"],"reading":"武忠祥讲义 第 2 章（同济 7.7）","practice":["解 8 道非齐次方程","总结特解设法表"],"exercises":[{"id":"w14d3e }，D₁=2，D₂=3，得 D_n = n+1。","difficulty":2}],"checklist":["范德蒙德结论会写会用","爪型消元方向选对","5 题独立完成"]},{"id":"w15d5","weekday":"周三","title":"行列式自测","minutes":120,"kind":"practice","learn":["自测范围：性质、展开、特殊型","自测节奏：先限时通做，再逐题对答案并归因"],"reading":"第 1 章自测","practice":["限时 40 分钟做 8 道题","错题归因"],"exercises":[{"id":"w15d5e1","title":"自测代表题","prompt":"计算行列式：第一行 1 2 3，第二行 2 4 6，第三行 7 8 9。\n验收：先观察行关系。","hint":"第二行是第一行的 2 倍。","answer":"两行成比例，行列式为 0。先看关系再动笔，比展开快。","difficulty":1}],"checklist":["正确率 ≥80%","符号错误为零","错题归因完成"]},{"id":"w16d1","weekday":"周四","title":"矩阵运算、逆与伴随","minutes":120,"kind":"learn","learn":["运算律与不可交换性","逆矩阵定义与 (AB)^{−1}=B^{−1}A^{−1}","伴随矩阵与 AA*=|A|E"],"reading":"李永乐线代讲义 第 2 章（同济 2.1–2.3）","practice":["求 3 个 3 阶矩阵的逆（伴随法）","用 AA*=|A|E 做 4 道计算"],"exercises":[{"id":"w16d1e1","title":"伴随法求逆","prompt":"A = [[1,2],[3,4]]，求 A^{−1}。\n验收：写出伴随矩阵并注意转置。","hint":"|A|=−2，A* = [[4,−2],[−3,1]]。","answer":"A^{−1} = (1/|A|)A* = [[−2,1],[1.5,−0.5]]。注意 A* 的每个元素是代数余子式放到转置位置。","difficulty":1}],"checklist":["伴随元素是代数余子式且要转置","逆存在的判定 |A|≠0","7 题错 ≤2"]},{"id":"w16d3","weekday":"周五","title":"初等变换、初等矩阵与秩","minutes":120,"kind":"learn","learn":["三类初等变换与对应初等矩阵","用初等变换求逆与求秩","秩的性质：r(AB)≤min、r(A+B)≤r(A)+r(B)"],"reading":"李永乐线代讲义 第 2 章（同济 2.4–2.6）","practice":["用初等行变换求 3 个矩阵的逆","求 5 个矩阵的秩"],"exercises":[{"id":"w16d3e1","title":"秩","prompt":"求 r(A)，A 为 3×4 矩阵：行向量 (1,2,3,4)、(2,4,6,8)、(1,0,1,0)。\n验收：化成行阶梯形。","hint":"第二行是第一行的 2 倍，先消去。","answer":"第一、二行成比例，剩余两行线性无关，r(A)=2。","difficulty":1}],"checklist":["求逆时左右不能混用","秩看非零行数（行阶梯形）","8 题错 ≤2"]},{"id":"w16d5","weekday":"周六","title":"分块矩阵与矩阵方程","minutes":120,"kind":"practice","learn":["分块矩阵的乘法与求逆","解 AX=B、XA=B 型矩阵方程","可逆矩阵与行列式的关系"],"reading":"李永乐线代讲义 第 2 章（同济 2.3、2.6 及习题）","practice":["分块对角矩阵求逆 3 道","解 4 个矩阵方程"],"exercises":[{"id":"w16d5e1","title":"分块对角求逆","prompt":"A = diag(B, C)，B、C 均可逆，求 A^{−1}。\n验收：直接写出结论并说明。","hint":"分块对角矩阵的逆仍是分块对角。","answer":"A^{−1} = diag(B^{−1}, C^{−1})。","difficulty":1}],"checklist":["分块求逆公式记得住","AX=B 用行变换 (A|B)→(E|X)","7 题独立完成"]},{"id":"w8_r ,"weekday":"周三","title":"单链表：建表、插入、删除","minutes":120,"kind":"practice","learn":["头结点的作用：统一空表与非空表操作","头插法与尾插法建表","按序号查找、按值查找、插入与删除的指针操作"],"reading":"王道 2.3 单链表","practice":["手写头插法建表，并说明为什么输出是逆序的","手写在第 i 个位置插入与删除第 i 个结点"],"exercises":[{"id":"w1d6e1","title":"指针顺序","prompt":"在 p 结点之后插入 s 结点，正确的两条语句是什么？如果写反会怎样？\n验收：写出语句并说明后果。","hint":"先让新结点接上后继，再让 p 指向新结点。","answer":"正确顺序：s->next = p->next; p->next = s;。写反成 p->next = s; s->next = p->next; 时 s->next 指向自己，后半条链丢失。","difficulty":1}],"checklist":["头结点不是数据结点，这一点不混","改指针的顺序不会把链断掉","能说出头插与尾插的时间复杂度差异"]},{"id":"w2d2","weekday":"周四","title":"双链表、循环链表与静态链表","minutes":120,"kind":"learn","learn":["双链表插入删除的四条指针","循环单链表与循环双链表的判空","静态链表用数组模拟，next 存下标"],"reading":"王道 2.3.2–2.3.4","practice":["手写双链表在 p 后插入 s","判断循环双链表为空的条件","静态链表的插入与删除"],"exercises":[{"id":"w2d2e1","title":"循环双链表判空","prompt":"带头结点的循环双链表 L 为空的判断条件是什么？和循环单链表有何不同？\n验收：分别写出两个条件。","hint":"空表时头结点的两个指针都指向自己。","answer":"循环双链表：L->next==L && L->prior==L；循环单链表只需 L->next==L。双链表要两个指针都自指才算空。","difficulty":2}],"checklist":["双链表改指针不留野指针","循环链表判空是 head->next==head","静态链表 0 号结点作头结点"]},{"id":"m1_4_rest","weekday":"周五","title":"今日无新课：顺序表/单链表代码各手写一遍","minutes":0,"kind":"rest","learn":[],"reading":"本周讲义 + 课后题；错题本里还没掌握的题","practice":[],"exercises":[],"checklist":[]},{"id":"m1_5_rest","weekday":"周六","title":"今日无新课：线性表选择题错题重做","minutes":0,"kind":"rest","learn":[],"reading":"本周讲义 + 课后题；错题本里还没掌握的题","practice":[],"exercises":[],"checklist":[]},{"id":"w1_review","weekday":"周日","title":"第 1 周复盘：线性表与复杂度","minutes":60,"kind":"review","learn":[],"reading":"错题本 + 本周王道/讲义章节","practice":["重做本周错题","核对另一科目本周进度"],"exercises":[],"checklist":["四类逻辑结构与四类存储结构能对上号","头结点作用说清楚","错题本已登记"]}],"phase":"p1"},{"week":2,"title":"数据结构②：栈、队列、串与数组","goal":"循环队列判空判满公式默写；KMP next 手推 3 题全对","target":"选择 40 + 大题 4（循环队列、KMP next）","check":"","days":[{"id":"w2d4","weekday":"周一","title":"线性表综合题","minutes":120,"kind":"learn","learn":["就地逆置单链表","找中间结点（快慢指针）","合并两个有序表、删除重复元素"],"reading":"王道 2.2–2.3 课后综合题","practice":["写单链表就地逆置（不许新建结点）" target":"选择 45 + 大题 4（IEEE754、海明码）","check":"","days":[{"id":"w8d2","weekday":"周一","title":"计算机系统概述与性能指标","minutes":120,"kind":"learn","learn":["冯·诺依曼结构与五大部件","层次结构：硬件、操作系统、语言、应用","性能指标：主频、CPI、MIPS、CPU 时间"],"reading":"王道《计算机组成原理》第 1 章","practice":["由主频与 CPI 计算程序执行时间","计算 MIPS 并说明它与执行时间的关系"],"exercises":[{"id":"w8d2e1","title":"执行时间","prompt":"某程序共 10⁶ 条指令，平均 CPI=2，主频 2GHz，求执行时间。\n验收：写出代入过程。","hint":"T = 指令数 × CPI × 时钟周期，时钟周期 = 1/主频。","answer":"T = 10⁶ × 2 / 2×10⁹ = 1×10⁻³ s = 1 ms。","difficulty":1}],"checklist":["CPU 时间 = 指令数 × CPI / 主频","MIPS 高不代表快（指令不同）","存储容量单位与字长分得清"]},{"id":"w8d4","weekday":"周二","title":"数制与定点数表示","minutes":120,"kind":"learn","learn":["进制转换与补码、反码、原码","补码的模运算思想","定点整数与定点小数的表示范围"],"reading":"王道 第 2 章 2.1","practice":["求 −37 的 8 位原码、反码、补码","写出 n 位补码的表示范围"],"exercises":[{"id":"w8d4e1","title":"补码求真值","prompt":"8 位补码 1001 0110 表示的真值是多少？\n验收：写出取反加一的换算过程。","hint":"符号位为 1 → 负数，其余位取反加一得绝对值。","answer":"001 0110 取反 110 1001 加 1 得 110 1010 = 106，故真值为 −106。也可直接用权值求和：−128+16+4+2=−106。","difficulty":2}],"checklist":["补码 −128 的存在（8 位）","由补码求真值：符号位为 1 时按位取反加 1","原码有 ±0，补码只有一个 0"]},{"id":"w8d6","weekday":"周三","title":"定点运算与溢出判断","minutes":120,"kind":"practice","learn":["补码加减法：符号位参与运算","溢出判断：双符号位、单符号位进位异或","移位运算与算术右移"],"reading":"王道 2.2","practice":["计算两个补码之并判断是否溢出（双符号位法）","说明算术右移与逻辑右移的区别"],"exercises":[{"id":"w8d6e1","title":"溢出判断","prompt":"用双符号位计算 [x]补=00,1011 与 [y]补=00,1100 相加，结果是否溢出？\n验收：写出相加过程与判据。","hint":"双符号位相加，看结果的两个符号位。","answer":"00,1011 + 00,1100 = 01,0111，符号位为 01，正溢出。真值 11+12=23 超出 4 位补码范围（−8..7）。","difficulty":2}],"checklist":["减法转成加负数补码","双符号位 01 正溢、10 负溢","算术右移补符号位"]},{"id":"w9d2","weekday":"周四","title":"浮点数表示（IEEE 754）","minutes":120,"kind":"learn","learn":["阶码、尾数、符号位与偏置值","IEEE 754 单精度：1+8+23，偏置 127","规格化数、非规格化数、特殊值"],"reading":"王道 2.3","practice":["把 −12.5 写成 IEEE 754 单精度","由 32 位浮点位串反推真值"],"exercises":[{"id":"w9d2e1","title":"IEEE 754","prompt":"十进制 −12.5 的 IEEE 754 单精度表示是什么？\n验收：写出阶码与尾数。","hint":"12.5 = 1100.1₂ = 1.1001×2³。","answer":"符号 1，阶码 ecklist":["理想吞吐率 = 1/最长段时间","数据冲突可用转发或停顿解决","控制冲突靠分支预测"]},{"id":"w13d4","weekday":"周三","title":"流水线性能与多发射","minutes":120,"kind":"learn","learn":["加速比 S = 串行时间 / 流水线时间","超标量、超流水线、多核的区别","指令级并行与乱序执行"],"reading":"王道 5.5.3","practice":["算 k 段流水线执行 n 条指令的时间与加速比","说明超标量与超流水线的区别"],"exercises":[{"id":"w13d4e1","title":"加速比","prompt":"5 段流水线，每段 1ns，执行 100 条指令，总时间与相对串行的加速比是多少？\n验收：写出 (k+n−1) 公式。","hint":"总时间 = (k + n − 1) × Δt。","answer":"时间 = (5+100−1)×1ns = 104ns；串行需 500ns，加速比 ≈ 4.8（理论极限是 5）。","difficulty":2}],"checklist":["时间 = (k + n − 1)·Δt","超标量：多条流水线并行","超流水线：把段切得更细"]},{"id":"w13d6","weekday":"周四","title":"总线、IO 接口、中断与 DMA","minutes":120,"kind":"practice","learn":["总线分类与定时（同步、异步）","IO 接口与端口编址","程序查询、中断、DMA 三种方式"],"reading":"王道 第 6–7 章","practice":["比较中断与 DMA 的 CPU 参与程度","说明中断响应过程中断点存在哪里"],"exercises":[{"id":"w13d6e1","title":"DMA 与中断","prompt":"DMA 方式下 CPU 还需要参与数据传输吗？它比中断方式快在哪里？\n验收：说明参与程度与速度差异来源。","hint":"DMA 是「外设↔主存」直通。","answer":"每传一个数据块 CPU 不介入，只在一整块传完后收一次中断；省掉了每次传送的中断响应与现场保护开销，故适合高速设备。","difficulty":2}],"checklist":["DMA 由硬件直接搬运，CPU 只在开头结尾参与","中断断点存栈或指定单元","DMA 优先级高于中断"]},{"id":"m9_4_rest","weekday":"周五","title":"今日无新课：数据通路微操作序列写 3 遍","minutes":0,"kind":"rest","learn":[],"reading":"本周讲义 + 课后题；错题本里还没掌握的题","practice":[],"exercises":[],"checklist":[]},{"id":"m9_5_rest","weekday":"周六","title":"今日无新课：中断与 DMA 5 行对比默写","minutes":0,"kind":"rest","learn":[],"reading":"本周讲义 + 课后题；错题本里还没掌握的题","practice":[],"exercises":[],"checklist":[]},{"id":"w9_review","weekday":"周日","title":"计组 100 分卷（限时 2 小时）","minutes":60,"kind":"review","learn":[],"reading":"错题本 + 本周王道/讲义章节","practice":["重做本周错题","核对另一科目本周进度"],"exercises":[],"checklist":["数据通路大题步骤齐全","流水线冒险与解决会说","错题按章归档"]}],"phase":"p1"},{"week":10,"title":"操作系统①：概述与进程管理","goal":"PV 大题能写信号量定义与初值；调度指标算得对","target":"选择 45 + 大题 4（PV、调度计算）","check":"","days":[{"id":"w14d2","title":"操作系统概述 + 进程的概念与状态","minutes":120,"kind":"learn","learn":["OS 的四个特征：并发、共享、虚拟、异步","内核态与用户态、系统调用","宏内核、微内核、外核","进程 = 程序 + 数据 + PCB","三态模型与五态模型","进程切换的开销来自哪里"],"reading":"王道《操作系统》第 1 章 + 2.1","practice":["说明系统调用与普通函数调用的区别","比较宏内核与微内核的性能与可靠性","画出五态转换图并标注触发事件","说明阻塞与就绪的区别"],"exercises":[{"id":"w14d2e1","title":"特权指令","prompt":"下列哪些是特权指令：关中断、读时钟、设置页表基址、整数加法？\n验收：逐个判断并说明原因。","hint":"特权指令会改变系统全局状态。","answer":"关中断、设置页表基址是特权指令；读时钟在多数体系里也受控；整数加法是普通指令，用户态可执行。","difficulty":2},{"id":"w14d4e1","title":"状态转换","prompt":"一个进程执行 I/O 请求后进入什么状态？I/O 完成后又进入什么状态？\n验收：写出两次状态名与原因。","hint":"等 I/O 是被动等待。","answer":"执行→阻塞（等待 I/O 完成）；I/O 完成→就绪（有了继续运行的资源，但还没拿到 CPU）。注意不是直接回运行态。","difficulty":1}],"checklist":["内核态可执行特权指令","系统调用是用户程序进内核的唯一入口","微内核可靠但通信开销大","阻塞是等资源、就绪是等 CPU","创建与终止状态的去向别弄反","切换要保存/恢复上下文"],"weekday":"周一"},{"id":"w14d6","title":"线程与处理机调度（含调度算法计算）","minutes":120,"kind":"learn","learn":["线程与进程的区别（资源与调度单位）","用户级线程与内核级线程","调度层次：高级、中级、低级","周转时间、带权周转时间、等待时间","FCFS、SJF、优先级、时间片轮转、多级反馈队列","抢占式与非抢占式"],"reading":"王道 2.2–3.1","practice":["说明同一进程内线程共享哪些资源","比较用户级线程与内核级线程的切换开销","对给定作业表分别算 FCFS 与 SJF 的平均周转时间","说明时间片过大过小各自的问题"],"exercises":[{"id":"w14d6e1","title":"线程共享","prompt":"同一进程的多个线程共享哪些内容？各自私有哪些？\n验收：各列 3 项。","hint":"共享的是「进程的资源」，私有的是「执行上下文」。","answer":"共享：地址空间、全局变量、打开的文件。私有：栈、寄存器组、程序计数器、线程 ID。","difficulty":2},{"id":"w15d2e1","title":"SJF 平均周转","prompt":"三个作业同时到达，运行时间分别为 1、4、8，SJF 下平均周转时间是多少？\n验收：写出执行顺序与各自完成时间。","hint":"同时到达时 SJF 按运行时间从短到长。","answer":"顺序 1→4→8，完成时刻 1、5、13，平均周转 =(1+5+13)/3≈6.33。","difficulty":2}],"checklist":["线程共享地址空间与打开文件","用户级线程切换不需要进内核","内核级线程可多核并行","周转 = 完成 − 到达","带权周转 = 周转 / 运行时间","时间片太小切换开销大、太大退化成 FCFS"],"weekday":"周二"},{"id":"w15d4","weekday":"周三","title":"同步互斥与信号量","minutes":120,"kind":"learn","learn":["临界区四原则：空闲让进、忙则等待、有限等待、让权等待","信号量 P/V 语义","互斥与同步的 PV 写法"],"reading":"王道 2.3","practice":["用信号量写生产者-消费者","用信号量实现两个进程的先后顺序"],"exercises":[{"id":"w15d4e1","title":"PV 顺序","prompt":"生产者-消费者中，为什么不能把 P(mutex) 放在 P(empty) 之前？\n验收：说明死锁场景。","hint":"mutex 保护缓冲区，empty 表示空位数。","answer":"若缓冲区满时先 P(mutex) 成功、再 P(empty) 阻塞，消费者因拿不到 mutex 无法取数据，双方互等 → 死锁。所以资源信号量的 P 必须在互斥 P 之前。","difficulty":3}],"checklist":["互斥信号量初值 1、同步信号量初值 0","P 在前 V 在后，顺序别反","先 P 互斥再 P 资源会死锁"]},{"id":"w15d6","weekday":"周四","title":"经典同步问题","minutes":120,"kind":"practice","learn":["生产者-消费者","读者-写者（读者优先与写者优先）","哲学家进餐与死锁避免"],"reading":"王道 2.3.4","practice":["写读者-写者的 PV 代码（读者优先）","说明哲学家进餐如何破坏循环等待"],"exercises":[{"id":"w15d6e1","title":"哲学家进餐","prompt":"哲学家进餐问题中，怎样修改规则可以避免死锁？给出两种方法。\n验收：各写一条规则。","hint":"死锁来自循环等待与同时持有。","answer":"方法一：最多允许 4 人同时取筷；方法二：奇偶编号，奇数先左后右、偶数先右后左；方法三：一次性拿两只（用互斥量保护取筷动作）。","difficulty":3}],"checklist":["读者优先要维护读者计数","写者优先需额外信号量","哲学家最多允许 4 人同时拿筷子"]},{"id":"w16d2","weekday":"周五","title":"管程与条件变量","minutes":120,"kind":"learn","learn":["管程的封装与互斥保证","条件变量的 wait/signal","管程与信号量的对比"],"reading":"王道 2.3.5","practice":["用管程改写生产者-消费者","说明 condition 与 semaphore 的区别"],"exercises":[{"id":"w16d2e1","title":"条件变量","prompt":"条件变量与信号量在语义上最大的区别是什么？\n验收：写一条核心区别。","hint":"一个会「记住」signal，一个不会。","answer":"信号量有计数，V 操作即使当前无等待者也会累加；条件变量没有记忆，signal 时若无等待者则什么也不发生。所以判断条件要用 while 而非 if。","difficulty":3}],"checklist":["管程内过程互斥执行","条件变量不计数，signal 无等待者时丢失","管程更易读，编译器保证互斥"]},{"id":"w16d4","title":"死锁与银行家算法","minutes":120,"kind":"practice","learn":["四个必要条件：互斥、占有并等待、不可抢占、循环等待","预防、避免、检测、解除","资源分配图与环路","Available、Max、Allocation、Need 矩阵","安全性检查：找安全序列","请求资源时的试探分配"],"reading":"王道 2.4 死锁","practice":["说明破坏「占有并等待」的两种做法","判断给定资源分配图是否死锁","对给定矩阵求一个安全序列","说明为什么安全状态不等于不会死锁"],"exercises":[{"id":"w16d4e1","title":"必要条件","prompt":"死锁的四个必要条件是什么？破坏其中任意一个是否一定能避免死锁？\n验收：列出四条并回答。","hint":"四个条件同时成立才可能死锁。","answer":"互斥、占有并等待、不可抢占、循环等待。破坏任一即可防止死锁，但实践中互斥往往无法破坏（如打印机），所以多从后三个入手。","difficulty":2},{"id":"w16d6e1","title":"安全序列","prompt":"Available=(3,3,2)，P0 的 Need=(7,4,3)，P1 的 Need=(1,2,2)，P2 的 Need=(6,0,0)，P3 的 Need=(0,1,1)。先执行哪个？\n验收：写出判断依据。","hint":"找 Need 各分量都不超过 Available 的进程。","answer":"P1 的 Need (1,2,2) ≤ (3,3,2)，可先执行；P3 的 (0,1,1) 也可。取 P1 后 Available 变为 (3,3,2)+(2,0,0)=(5,3,2)，继续推进。","difficulty":3}],"checklist":["四个条件缺一不可","预防是静态的、避免是动态的","有环不一定死锁（同类资源多时）","Need = Max − Allocation","每次找 Need ≤ Available 的进程并回收其资源","不安全状态只是「可能」死锁"],"weekday":"周六"},{"id":"w10_review","weekday":"周日","title":"第 10 周复盘：进程与同步","minutes":60,"kind":"review","learn":[],"reading":"错题本 + 本周王道/讲义章节","practice":["重做本周错题","核对另一科目本周进度"],"exercises":[],"checklist":["进程状态转换图能画","信号量 P/V 顺序不写反","银行家算法能算安全序列"]}],"phase":"p1"},{"week":11,"title":"操作系统②：内存、文件与 IO + OS 测","goal":"OS 100 分卷 ≥70；页面置换与磁盘调度计算全对","target":"选择 50 + 大题 5 + 100 分测 1 套","check":"检查点 3：操作系统 100 分卷 ≥70","days":[{"id":"w17d2","weekday":"周一","title":"连续分配与分页","minutes":120,"kind":"learn","learn":["单一连续、固定分区、动态分区","首次适应、最佳适应、最坏适应","分页：页表与页框"],"reading":"王道 3.1","practice":["对空闲分区链分别用三种算法分配同一请求并比较剩余","说明内部碎片与外部碎片的来源"],"exercises":[{"id":"w17d2e1","title":"碎片类型","prompt":"分页存储管理会产生哪种碎片？分段呢？\n验收：各写一种并说明原因。","hint":"碎片取决于分配单位与需求是否对齐。","answer":"分页：内部碎片（最后一页装不满）；分段：外部碎片（段大小不定，留下不连续空洞）。","difficulty":1}],"checklist":["最佳适应产生最小剩余但易碎","分页有内部碎片、无外部碎片","分段有外部碎片"]},{"id":"w17d4","weekday":"周二","title":"地址转换与快表","minutes":120,"kind":"learn","learn":["逻辑地址 = 页号 + 页内偏移","页表项与页表基址寄存器","TLB 命中率对有效访问时间的影响"],"reading":"王道 3.1.3","practice":["给定页大小与逻辑地址，求页号与偏移","算有 TLB 时的有效访问时间"],"exercises":[{"id":"w17d4e1","title":"地址转换","prompt":"页大小 1KB，逻辑地址 2500，页号与页内偏移分别是多少？\n验收：写出除法与取余。","hint":"2500 ÷ 1024。","answer":"页号 = 2，偏移 = 2500 − 2048 = 452。注意页号从 0 开始。","difficulty":1}],"checklist":["页号 = 逻辑地址 / 页大小","TLB 命中只需一次访存","多级页表逐级查"]},{"id":"w17d6","weekday":"周三","title":"虚拟内存与缺页处理","minutes":120,"kind":"practice","learn":["局部性原理与虚拟内存","请求分页：缺页中断与页面调入","抖动（颠簸）的成因"],"reading":"王道 3.2","practice":["说明缺页中断与普通中断的区别","解释为什么分配页框过少会导致抖动"],"exercises":[{"id":"w17d6e1","title":"缺页中断","prompt":"缺页中断属于内中断还是外中断？它与一般中断有何不同？\n验收：写两点区别。","hint":"缺页是 CPU 执行指令时发现的。","answer":"属于内中断（异常）。区别：缺页在指令执行过程中产生且处理后可重新执行该指令；一般 I/O 中断在指令结束后响应。","difficulty":2}],"checklist":["缺页中断在指令执行期间产生","页面调入可能触发页面置换","抖动是置换出去的页很快又被访问"]},{"id":"w18d2","weekday":"周四","title":"页面置换算法","minutes":120,"kind":"learn","learn":["OPT、FIFO、LRU、CLOCK","Belady 异常（FIFO 独有）","缺页率计算"],"reading":"王道 3.2.3","practice":["对访问串 7,0,1,2,0,3,0,4 用 FIFO 与 LRU 各算缺页次数（3 个页框）","说明 CLOCK 算法的访问位作用"],"exercises":[{"id":"w18d2e1","title":"LRU 缺页","prompt":"访问串 7,0,1,2,0,3,0,4，3 个页框，LRU 的缺页次数是多少？\n验收：逐个写出页框内容。","hint":"每次访问把该页移到「最近使用」端。","answer":"7 缺、0 缺、1 缺、2 缺（换 7）、0 命中、3 缺（换 1）、0 命中、4 缺（换 2），共 6 次缺页。","difficulty":3}],"checklist":["FIFO 可能出现页框多反而缺页多","LRU 用栈或链表实现","OPT 只是理论最优"]},{"id":"w18d4","weekday":"周五","title":"文件系统与目录","minutes":120,"kind":"learn","learn":["文件逻辑结构与物理结构（连续、链接、索引）","目录与 FCB、多级目录","文件共享与保护"],"reading":"王道 4.1–4.2","practice":["比较三种文件分配方式的随机访问能力","说明索引结点（inode）省了什么"],"exercises":[{"id":"w18d4e1","title":"分配方式","prompt":"哪种文件物理结构既支持随机访问又便于文件增长？说明代价。\n验收：写出名称与代价。","hint":"对比连续、链接、索引。","answer":"索引分配支持随机访问且便于扩展；代价是索引块本身占空间，大文件需要多级索引。","difficulty":2}],"checklist":["连续分配支持随机访问但难扩展","链接分配不能随机访问","inode 把文件名与描述信息分离"]},{"id":"w18d6","weekday":"周六","title":"磁盘调度与 IO 管理","minutes":120,"kind":"practice","learn":["FCFS、SSTF、SCAN、C-SCAN","磁头移动距离计算","IO 软件层次与缓冲区"],"reading":"王道 4.3–5.2","practice":["对请求序列 98,183,37,122,14,124,65,67（当前 53）算 SSTF 的移动总量","说明缓冲区的三个作用"],"exercises":[{"id":"w18d6e1","title":"SSTF","prompt":"磁头当前在 53，请求队列 98,183,37,122,14,124,65,67，SSTF 的服务顺序是什么？\n验收：写出顺序并算总移动。","hint":"每次选距离当前磁头最近的请求。","answer":"顺序：65,67,37,14,98,122,124,183。总移动 = 12+2+30+23+84+24+2+59 = 236。","difficulty":3}],"checklist":["SSTF 选最近的，可能饥饿","SCAN 到端点才折返","缓冲：缓和速度差、减少中断、提高并行"]},{"id":"w11_review","weekday":"周日","title":"操作系统 100 分卷（限时 2 小时）","minutes":60,"kind":"review","learn":[],"reading":"错题本 + 本周王道/讲义章节","practice":["重做本周错题","核对另一科目本周进度"],"exercises":[],"checklist":["页表与快表计算不错","页面置换手算 4 种算法","I/O 控制方式对比表默写"]}],"phase":"p1"},{"week":12,"title":"计算机网络一轮 + 408 总测","goal":"408 150 分总测 ≥90；四科框架图能默写；计选 55 + 大题 5","target":"选择 55 + 大题 5 + 150 分总测 1 套","check":"检查点 4：408 150 分总测 ≥90","days":[{"id":"w19d2","title":"计网体系结构、性能指标与物理层","minutes":120,"kind":"learn","learn":["OSI 七层与 TCP/IP 四层","各层数据单元与典型协议","时延：发送、传播、处理、排队","码元、波特率与比特率","奈奎斯特定理与香农定理","编码与调制、传输介质"],"reading":"王道《计算机网络》第 1–2 章","practice":["把五层模型与各层典型设备、协议对应起来","区分发送时延与传播时延","用奈氏准则算无噪声信道的最大数据率","用香农公式算有噪声 个子网（.0/.64/.128/.192），每子网 64 个地址，可用主机 62 个（去掉网络地址与广播地址）。","difficulty":2}],"checklist":["集线器不隔离冲突域","交换机每个端口一个冲突域","VLAN 隔离广播域","网络地址 = IP AND 掩码","/26 每子网 64 个地址、可用 62","片偏移以 8 字节为单位"],"weekday":"周三"},{"id":"w21d2","title":"路由协议 + ARP、ICMP、NAT 与 IPv6","minutes":120,"kind":"learn","learn":["静态路由与动态路由","RIP（距离向量）、OSPF（链路状态）、BGP","最长前缀匹配","ARP 的作用与广播请求","ICMP 与 ping/traceroute","NAT 与端口映射、IPv6 特点"],"reading":"王道 4.3–4.4","practice":["对给定路由表做最长前缀匹配","比较 RIP 与 OSPF 的收敛速度与适用范围","描述一次同网段与跨网段的 ARP 过程","说明 NAT 如何解决地址短缺"],"exercises":[{"id":"w21d2e1","title":"最长前缀","prompt":"路由表有 10.0.0.0/8、10.1.0.0/16、10.1.2.0/24，目的地址 10.1.2.5 匹配哪条？\n验收：说明匹配规则。","hint":"三条都匹配时取前缀最长的。","answer":"匹配 /24 那条 10.1.2.0/24。最长前缀匹配保证转发更精确。","difficulty":1},{"id":"w21d4e1","title":"跨网段 ARP","prompt":"主机 A 访问另一网段的主机 B，ARP 请求的是谁的 MAC 地址？\n验收：写出目标并说明原因。","hint":"A 无法直接问 B，因为不在同一广播域。","answer":"请求网关（默认路由器）的 MAC。数据帧先发给网关，再由网关转发。","difficulty":2}],"checklist":["RIP 最大 15 跳","OSPF 用 Dijkstra、收敛快","BGP 用于自治系统之间","ARP 只在同一广播域内","跨网段 ARP 找的是网关","NAT 修改源 IP 与端口"],"weekday":"周四"},{"id":"w21d6","title":"传输层：UDP、TCP 连接管理与可靠传输","minutes":120,"kind":"learn","learn":["UDP 的特点与适用场景","TCP 三次握手与四次挥手","TIME_WAIT 与半关闭","序号、确认、超时重传与快速重传","慢开始、拥塞避免、快重传、快恢复","发送窗口 = min(拥塞窗口, 接收窗口)"],"reading":"王道 5.1–5.2","practice":["画出三次握手与四次挥手的报文与状态","说明为什么握手三次而不是两次","对给定 cwnd 变化图判断处于哪个阶段","算超时后的 ssthresh 与 cwnd"],"exercises":[{"id":"w21d6e1","title":"三次握手","prompt":"为什么 TCP 建立连接需要三次握手，两次不行吗？\n验收：给出核心原因。","hint":"两次无法让双方都确认「对方能收也能发」。","answer":"第三次握手让服务端确认客户端已收到自己的 SYN，且客户端确实能接收；同时防止历史失效连接请求造成资源浪费。","difficulty":3},{"id":"w22d2e1","title":"拥塞窗口","prompt":"cwnd=16 时发生超时，ssthresh 与新的 cwnd 各是多少？\n验收：写出规则与数值。","hint":"超时视为严重拥塞。","answer":"ssthresh = 16/2 = 8，cwnd 重置为 1，重新慢开始，涨到 8 后转拥塞避免。","difficulty":2}],"checklist":["SYN、ACK、FIN 标志位","TIME_WAIT 等 2MSL","两次握手无法确认客户端接收能力","超时：ssthresh=cwnd/2，cwnd=1","快重传：cwnd 减半后进入快恢复","接收窗口由接收方通告"],"weekday":"周五"},{"id":"w22d4","title":"拥塞控制 + 应用层（DNS/HTTP/邮件/FTP）","minutes":120,"kind":"practice","learn":["     math2: JSON.parse(document.getElementById('plan-math2').textContent),
    cs408: JSON.parse(document.getElementById('plan-cs408').textContent),
    english: JSON.parse(document.getElementById('plan-english').textContent),
    politics: JSON.parse(document.getElementById('plan-politics').textContent)
  };
  var KEY = 'study-22408-v2';
  var OLD_KEY = 'math2-plan-state-v1';
  var KINDS = {learn:'学习', practice:'练习', review:'复盘', rest:'机动'};
  var PLAN_META = {math2:{short:'数学二'}, cs408:{short:'408'}, english:{short:'英语'}, politics:{short:'政治'}};

  var cache = {};
  function daysOf(p){
    if(cache[p]) return cache[p];
    var list = [];
    PLANS[p].weeks.forEach(function(w){
      w.days.forEach(function(d){
        list.push(Object.assign({}, d, {week:w.week, weekTitle:w.title, pid:p}));
      });
    });
    cache[p] = list;
    return list;
  }
  function dayById(p, id){
    return daysOf(p).filter(function(d){ return d.id === id; })[0];
  }

  var state = load();
  function blank(p){
    return {startDate: PLANS[p].startDate, mode:'progress', offset:null, checks:{}};
  }
  function normalize(s){
    if(!s.plans) s.plans = {};
    Object.keys(PLANS).forEach(function(k){
      if(!s.plans[k]) s.plans[k] = blank(k);
      if(!s.plans[k].checks) s.plans[k].checks = {};
    });
    if(!s.active || !PLANS[s.active]) s.active = Object.keys(PLANS)[0];
    if(!s.wrong) s.wrong = {};
    return s;
  }
  function emptyState(){
    var s = {active:'math2', plans:{}, wrong:{}};
    Object.keys(PLANS).forEach(function(k){ s.plans[k] = blank(k); });
    return s;
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var s = JSON.parse(raw);
        if(s && s.plans && s.active && PLANS[s.active]) return normalize(s);
      }
    }catch(e){}
    var s = emptyState();
    try{
      var old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
      if(old && old.checks){
        s.plans.math2.checks = old.checks;
        s.plans.math2.mode = old.mode || 'progress';
        if(old.startDate) s.plans.math2.startDate = old.startDate;
      }
    }catch(e){}
    return s;
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function P(){ return state.plans[state.active]; }
  function pid(){ return state.active; }
  function plan(){ return PLANS[state.active]; }

  function Pof(p){ return state.plans[p]; }
  function planOf(p){ return PLANS[p]; }
  function dsOf(p, dayId){
    var st = Pof(p);
    if(!st.checks) st.checks = {};
    if(!st.checks[dayId]) st.checks[dayId] = {c:[], e:[], done:false};
    var s = st.checks[dayId];
    if(!s.c) s.c = [];
    if(!s.e) s.e = [];
    return s;
  }
  function ds(dayId){ return dsOf(pid(), dayId); }
  function isRest(d){ return d.kind === 'rest'; }
  function isDoneOf(p, d){
    if(isRest(d)) return true;
    var st = Pof(p);
    var sc = st.checks && st.checks[d.id];
    return !!(sc && sc.done);
  }
  function isDone(d){ return isDoneOf(pid(), d); }
  function studyDays(p){ return daysOf(p).filter(function(d){ return d.kind === 'learn' || d.kind === 'practice'; }); }
  function reviewDays(p){ return daysOf(p).filter(function(d){ return d.kind === 'review'; }); }
  function exTotal(p){ return daysOf(p).reduce(function(n,d){ return n + (d.exercises ? d.exercises.length : 0); }, 0); }
  function exDone(p){
    return daysOf(p).reduce(function(n,d){
      var s = state.plans[p].checks[d.id];
      return n + (d.exercises || []).filter(function(_,i){ return s && s.e && s.e[i]; }).length;
    }, 0);
  }
  function revDone(p){
    return reviewDays(p).filter(function(d){
      var s = state.plans[p].checks[d.id]; return s && s.done;
    }).length;
  }
  function nextUndoneOf(p){
    var st = studyDays(p);
    for(var i=0;i<st.length;i++){ if(!isDoneOf(p, st[i])) return st[i]; }
    return null;
  }
  function nextUndone(){ return nextUndoneOf(pid()); }
  function byDateOf(p){
    var st = Pof(p);
    var start = new Date(st.startDate + 'T00:00:00');
    var now = new Date(); now.setHours(0,0,0,0);
    var off = Math.round((now - start)/86400000);
    var list = daysOf(p);
    if(off < 0) return list[0];
    if(off >= list.length) return null;
    return list[off];
  }
  function byDate(){ return byDateOf(pid()); }
  function curDayOf(p){
    var st = Pof(p);
    var list = daysOf(p);
    if(st.offset !== null && st.offset !== undefined && list[st.offset]) return list[st.offset];
    if(st.mode === 'date') return byDateOf(p);
    return nextUndoneOf(p) || list[list.length-1];
  }
  function curDay(){ return curDayOf(pid()); }
  // ---- 单词进度（英语专用：词库总数 + 每日量 + 打卡）
  function wordBookOf(p){ return planOf(p).wordBook || null; }
  function wordStateOf(p){
    var wb = wordBookOf(p);
    if(!wb) return null;
    var st = Pof(p);
    if(!st.words) st.words = { done: wb.startDone || 0, cycle: wb.startCycle || 1, perDay: wb.defaultPerDay || 100, log: {} };
    var w = st.words;
    if(!w.log) w.log = {};
    if(!w.perDay) w.perDay = wb.defaultPerDay || 100;
    if(w.done == null) w.done = wb.startDone || 0;
    if(w.cycle == null) w.cycle = 1;
    return w;
  }
  function wordTodayOf(p){
    var w = wordStateOf(p);
    if(!w) return 0;
    return w.log[fmt(todayD())] || 0;
  }
  function wordLogOf(p, n){
    var w = wordStateOf(p);
    if(!w) return;
    var k = fmt(todayD());
    w.log[k] = Math.max(0, (w.log[k] || 0) + n);
    w.done = Math.max(0, w.done + n);
    if(!w.log[k]) delete w.log[k];
    save();
  }
  function wordBook(){ return wordBookOf(pid()); }
  function wordState(){ return wordStateOf(pid()); }
  function wordToday(){ return wordTodayOf(pid()); }
  function wordLog(n){ return wordLogOf(pid(), n); }
  function wordRangeOf(p){
    var wb = wordBookOf(p), w = wordStateOf(p);
    if(!wb || !w) return null;
    var total = wb.total, done = Math.min(w.done, total);
    var per = w.perDay || 100;
    var from = done + 1, to = Math.min(total, done + per);
    var groups = wb.lists || 50;
    var gi = Math.min(groups, Math.floor(done / (total / groups)) + 1);
    return { total: total, done: done, remain: total - done, per: per, from: from, to: to, group: gi,
             pct: Math.min(100, Math.round(done / total * 1000) / 10), w: w };
  }
  function wordRange(){ return wordRangeOf(pid()); }
  function wordCardHtml(){
    var r = wordRange();
    if(!r) return '';
    var wb = wordBook(), w = r.w, td = wordToday();
    var days = r.per > 0 ? Math.ceil(r.remain / r.per) : 0;
    var finish = new Date(todayD().getTime() + days * 86400000);
    var html = '<div class="wordcard">' +
      '<div class="row"><b style="font-size:13.5px">单词进度 · 第 ' + w.cycle + ' 轮</b>' +
      '<span class="pill">' + esc(wb.name) + ' ' + r.total + ' 词</span><div class="grow"></div>' +
      '<span class="sub">' + r.done + ' / ' + r.total + ' · ' + r.pct + '%</span></div>' +
      '<div class="bar"><i style="width:' + r.pct + '%"></i></div>' +
      '<div style="margin-top:8px;font-size:12.5px;color:var(--muted)">本轮剩 ' + r.remain + ' 词 · ' +
      (r.remain > 0 ? '按每天 ' + r.per + ' 词 → 约 ' + days + ' 天，' + fmt(finish) + ' 背完' : '本轮已背完') + '</div>';
    if(r.remain > 0){
      var tStart = Math.max(1, r.done - td + 1);
      var tEnd = Math.min(r.total, tStart + r.per - 1);
      html += '<div class="row" style="margin-top:10px">' +
        '<span class="sub">' + (td > 0 ? '今日目标' : '今日') + '：第 ' + tStart + '–' + tEnd + ' 词（' + esc(wb.name) + '第 ' + r.group + ' 组）</span>' +
        '<div class="grow"></div><span class="sub">今日已背 <b>' + td + '</b> 词</span></div>' +
        '<div class="row" style="margin-top:8px">' +
        '<span class="sub">今日背了</span>' +
        '<input id="wnum" type="number" min="10" max="600" step="10" value="' + r.per + '">' +
        '<span class="sub">词</span>' +
        '<button class="btn pri sm" id="wlog">打卡</button>' +
        '<button class="btn sm" id="wundo">撤销今日</button>' +
        '<div class="grow"></div><span class="sub">每日单词量</span>' +
        '<button class="btn sm" data-wstep="-20">−</button>' +
        '<input id="wpd" type="number" min="10" max="600" step="10" value="' + r.per + '">' +
        '<button class="btn sm" data-wstep="20">+</button>' +
        [60, 80, 100, 150].map(function(v){
          return '<button class="btn sm' + (v === r.per ? ' sel' : '') + '" data-wset="' + v + '">' + v + '</button>';
        }).join('') +
        '</div>' +
        '<div class="row" style="margin-top:8px"><span class="sub">进度校准</span>' +
        '<input id="wdone" type="number" min="0" max="' + r.total + '" value="' + w.done + '">' +
        '<button class="btn sm" id="wsave">保存</button>' +
        '<span class="sub">背到第几个词就填几，用来修正</span></div>';
    }else{
      html += '<div class="row" style="margin-top:10px"><button class="btn pri sm" id="wnext">开始第 ' + (w.cycle + 1) + ' 轮</button>' +
        '<span class="sub">本轮 ' + r.total + ' 词已过完</span></div>';
    }
    return html + '</div>';
  }
  function wordRowHtml(p){
    p = p || pid();
    var r = wordRangeOf(p);
    if(!r) return '';
    var td = wordTodayOf(p);
    var checked = td > 0;
    var label = r.remain > 0
      ? '单词：今日 ' + r.per + ' 词（第 ' + r.from + '–' + r.to + ' 词）'
      : '单词：本轮已背完（' + r.total + ' 词）';
    return '<label class="check ' + (checked ? 'done' : '') + '"><input type="checkbox" id="wordChk" data-gp="' + p +
      '" data-gw="' + p + '"' + (checked ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
  }
  function bindWordCard(){
    var el = document.getElementById('view');
    var w = wordState();
    if(!w) return;
    var r = wordRange();
    var log = el.querySelector('#wlog');
    if(log) log.addEventListener('click', function(){
      var num = parseInt((el.querySelector('#wnum') || {}).value, 10);
      if(!num || num < 1) num = r.per;
      logWords(num);
    });
    var undo = el.querySelector('#wundo');
    if(undo) undo.addEventListener('click', function(){
      if(wordToday() === 0) return;
      logWords(-wordToday());
    });
    el.querySelectorAll('[data-wstep]').forEach(function(b){
      b.addEventListener('click', function(){
        var v = Math.max(10, Math.min(600, (r.per || 100) + parseInt(b.dataset.wstep, 10)));
        w.perDay = v; save(); renderHead(); renderToday();
      });
    });
    el.querySelectorAll('[data-wset]').forEach(function(b){
      b.addEventListener('click', function(){
        w.perDay = parseInt(b.dataset.wset, 10); save(); renderHead(); renderToday();
      });
    });
    var pd = el.querySelector('#wpd');
    if(pd) pd.addEventListener('change', function(){
      var v = parseInt(pd.value, 10);
      if(!v || v < 10 || v > 600) return;
      w.perDay = v; save(); renderHead(); renderToday();
    });
    var sv = el.querySelector('#wsave'), dn = el.querySelector('#wdone');
    if(sv && dn) sv.addEventListener('click', function(){
      var v = parseInt(dn.value, 10);
      if(isNaN(v) || v < 0) return;
      w.done = Math.min(wordBook().total, v);
      save(); renderHead(); renderToday();
    });
    var nx = el.querySelector('#wnext');
    if(nx) nx.addEventListener('click', function(){
      w.done = 0; w.cycle = (w.cycle || 1) + 1; w.log = {};
      save(); renderHead(); renderToday();
    });
    var chk = el.querySelector('#wordChk');
    if(chk) chk.addEventListener('change', function(){
      if(chk.checked){ if(wordToday() === 0) logWords(r.per); else renderToday(); }
      else { if(wordToday() > 0) logWords(-wordToday()); else renderToday(); }
    });
  }

  // ---- 章节进度（数学二 / 408：按武忠祥 / 王道章节勾）
  function courseOf(p){ return planOf(p).course || null; }
  function chapterStateOf(p){
    var st = Pof(p);
    if(!st.chapters) st.chapters = {};
    return st.chapters;
  }
  function chapterStatsOf(p){
    var c = courseOf(p);
    if(!c) return null;
    var cs = chapterStateOf(p);
    var total = 0, done = 0, groups = [];
    c.books.forEach(function(b){
      var d = 0;
      b.chapters.forEach(function(ch){ total++; if(cs[ch.id] && cs[ch.id].done){ done++; d++; } });
      groups.push({id: b.id, name: b.name, short: b.short || b.name, book: b.book,
                   done: d, total: b.chapters.length, pct: b.chapters.length ? Math.round(d / b.chapters.length * 100) : 0});
    });
    return {total: total, done: done, pct: total ? Math.round(done / total * 100) : 0,
            groups: groups, books: c.books, state: cs, title: c.title};
  }
  function chapterListHtml(p){
    var cs = chapterStatsOf(p);
    if(!cs) return '';
    return cs.books.map(function(b, bi){
      var g = cs.groups[bi];
      var open = cs.total <= 12 || bi === 0;
      return '<details class="chapgroup"' + (open ? ' open' : '') + '>' +
        '<summary><span>' + esc(b.short || b.name) + '</span><span class="sub" data-chapgroup="' + b.id + '">' + g.done + '/' + g.total + '</span></summary>' +
        b.chapters.map(function(ch){
          var st = cs.state[ch.id] || {};
          return '<label class="chap' + (st.done ? ' done' : '') + '"><input type="checkbox" data-chapter="' + p + '|' + ch.id + '"' +
            (st.done ? ' checked' : '') + '><span>' + esc(ch.name) + '</span></label>';
        }).join('') + '</details>';
    }).join('');
  }
  function chapterCardHtml(p){
    var cs = chapterStatsOf(p);
    if(!cs) return '';
    return '<div class="card side-card" data-chap-card><div class="row"><b>章节进度</b><div class="grow"></div>' +
      '<span class="sub" data-chap-total>' + cs.done + ' / ' + cs.total + ' 章</span></div>' +
      '<div class="bar" style="margin-top:8px"><i data-chap-bar style="width:' + cs.pct + '%"></i></div>' +
      '<div class="sub" style="margin-top:6px">' + esc(cs.title) + '</div>' +
      '<div class="chapters">' + chapterListHtml(p) + '</div>' +
      '<div class="sub" style="margin-top:6px">过完一章勾一章；点书名列可收起。</div></div>';
  }
  function phaseSideCard(){
    var ph = curPhase();
    if(!ph) return '';
    var st = phaseStats(ph);
    var pct = st.study ? Math.round(st.done / st.study * 100) : 0;
    var left = diffDays(dISO(ph.end), todayD());
    return '<div class="card side-card"><div class="row"><b>当前阶段</b><div class="grow"></div>' +
      '<span class="pill">' + esc(ph.short) + '</span></div>' +
      '<div class="sub" style="margin-top:6px">' + ph.start + ' → ' + ph.end + ' · ' + ph.weeks + ' 周</div>' +
      '<div class="kv" style="margin:6px 0 0"><b>周次</b><span>第 ' + phaseWeekIndex(ph) + '/' + ph.weeks + ' 周' +
      (left >= 0 ? ' · 剩 ' + left + ' 天' : '') + '</span></div>' +
      '<div class="kv"><b>目标</b><span>' + esc(ph.goal) + '</span></div>' +
      (st.study ? '<div class="bar" style="margin-top:6px"><i style="width:' + pct + '%"></i></div>' +
        '<div class="sub" style="margin-top:4px">学习日 ' + st.done + '/' + st.study + '</div>' : '') +
      '<div class="row" style="margin-top:10px"><button class="btn sm" data-side-phase="1">看阶段详情 →</button></div></div>';
  }
  function bindChapter(el){
    el.querySelectorAll('input[data-chapter]').forEach(function(box){
      box.addEventListener('change', function(){
        var parts = box.dataset.chapter.split('|');
        var cs = chapterStateOf(parts[0]);
        var prev = cs[parts[1]] || {done:false};
        var lab = box.closest('label');
        cs[parts[1]] = box.checked ? {done:true, at:fmt(todayD())} : {done:false};
        save();
        if(lab) lab.classList.toggle('done', box.checked);
        if(view === 'stats') renderStats(); else updateChapterDom(parts[0]);
        toast((box.checked ? '已过 · ' : '取消 · ') + shortText(lab ? lab.innerText : '', 16), '撤销', function(){
          cs[parts[1]] = prev;
          box.checked = !!prev.done;
          save();
          if(view === 'stats'){ renderStats(); }
          else { if(lab) lab.classList.toggle('done', !!prev.done); updateChapterDom(parts[0]); }
        });
      });
    });
  }
  function bindSide(el){
    var b = el.querySelector('[data-side-phase]');
    if(b) b.addEventListener('click', function(){ switchView('phase'); window.scrollTo(0, 0); });
  }
  function wrapToday(html){
    var p = pid(), side = '';
    if(plan().wordBook) side += wordCardHtml();
    if(courseOf(p)) side += chapterCardHtml(p);
    side += phaseSideCard();
    if(!side) return html;
    return '<div class="today-wrap"><div class="today-main">' + html + '</div><aside class="today-side">' + side + '</aside></div>';
  }

  function fmt(d){
    if(!d) return '';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // ---- 阶段（phase）：全年四段，日期区间 + 目标 + 主线 + 门槛 + 周骨架
  function dISO(s){ return new Date(String(s).slice(0,10) + 'T00:00:00'); }
  function todayD(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function diffDays(a,b){ return Math.round((a - b)/86400000); }
  function md(s){ return String(s || '').slice(5,10).replace('-', '.'); }
  function shortDate(s){ return String(s || '').slice(2).replace(/-/g, '.'); }
  function phases(){ return plan().phases || []; }
  function phaseById(id){
    var list = phases();
    for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
    return null;
  }
  function phaseState(ph){
    var now = todayD();
    if(now > dISO(ph.end)) return 'done';
    if(now >= dISO(ph.start)) return 'active';
    return 'todo';
  }
  function curPhaseOf(p){
    var list = planOf(p).phases || [], now = todayD();
    if(!list.length) return null;
    for(var i=0;i<list.length;i++){ if(now <= dISO(list[i].end)) return list[i]; }
    return list[list.length-1];
  }
  function curPhase(){ return curPhaseOf(pid()); }
  function phaseWeekIndex(ph){
    var n = Math.floor(diffDays(todayD(), dISO(ph.start))/7) + 1;
    if(n < 1) n = 1;
    if(n > ph.weeks) n = ph.weeks;
    return n;
  }
  function phaseWeeks(ph){
    return plan().weeks.filter(function(w){ return w.phase === ph.id; });
  }
  function phaseStats(ph){
    var out = {weeks:0, study:0, done:0, ex:0, exDone:0, rev:0, revDone:0};
    var wks = phaseWeeks(ph);
    out.weeks = wks.length;
    wks.forEach(function(w){
      (w.days || []).forEach(function(d){
        var s = P().checks[d.id] || {};
        if(d.kind === 'learn' || d.kind === 'practice'){
          out.study++;
          if(s.done) out.done++;
        }else if(d.kind === 'review'){
          out.rev++;
          if(s.done) out.revDone++;
        }
        (d.exercises || []).forEach(function(_,i){
          out.ex++;
          if(s.e && s.e[i]) out.exDone++;
        });
      });
    });
    return out;
  }
  function phaseBadge(ph){
    var st = phaseState(ph);
    return st === 'done' ? '<span class="pill ok">已结束</span>'
      : st === 'active' ? '<span class="pill">进行中 · 第 ' + phaseWeekIndex(ph) + '/' + ph.weeks + ' 周</span>'
      : '<span class="pill wait">未开始</span>';
  }
  function phaseBarHtml(){
    var list = phases();
    if(!list.length) return '';
    var now = todayD();
    var cur = curPhase();
    return list.map(function(ph){
      var st = phaseState(ph), s = phaseStats(ph);
      var pct = s.study ? Math.round(s.done/s.study*100) : 0;
      var left = diffDays(dISO(ph.end), now);
      var tail = st === 'active' ? (left >= 0 ? '剩 ' + left + ' 天' : '超期 ' + (-left) + ' 天')
        : st === 'todo' ? diffDays(dISO(ph.start), now) + ' 天后开始' : phaseWeeks(ph).length ? '已走完' : '未排细化';
      return '<button class="ph ' + (cur && cur.id === ph.id ? 'on' : '') + (st === 'done' ? ' done' : '') +
        '" data-phase="' + ph.id + '">' +
        '<span class="n">第 ' + ph.seq + ' 阶段 · ' + ph.weeks + ' 周</span>' +
        '<span class="t">' + esc(ph.short) + '</span>' +
        '<span class="d">' + shortDate(ph.start) + ' → ' + shortDate(ph.end) + ' · ' + tail + '</span>' +
        (s.study ? '<span class="pw"><i style="width:' + pct + '%"></i></span>' : '') +
        '</button>';
    }).join('');
  }
  function totalPhaseWeeks(){
    return phases().reduce(function(n,p){ return n + (p.weeks || 0); }, 0);
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function streak(p){
    var st = studyDays(p), n = 0;
    for(var i=0;i<st.length;i++){
      var s = state.plans[p].checks[st[i].id];
      if(s && s.done) n++; else break;
    }
    return n;
  }

  // ---- 轻提示 + 撤销
  var toastTimer = null;
  function hideToast(){
    var t = document.getElementById('toast');
    if(t) t.classList.remove('show');
  }
  function toast(msg, actionLabel, actionFn){
    var t = document.getElementById('toast');
    if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.innerHTML = '<span></span>';
    t.firstChild.textContent = msg;
    if(actionLabel){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = actionLabel;
      b.addEventListener('click', function(){ hideToast(); if(actionFn) actionFn(); });
      t.appendChild(b);
    }
    clearTimeout(toastTimer);
    t.classList.add('show');
    toastTimer = setTimeout(hideToast, 4200);
  }
  function shortText(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }

  // ---- 打卡日历（日期 → 当天打卡次数）
  function planStartOf(p){ return dISO(planOf(p).startDate); }
  function dayDateOf(p, idx){ return new Date(planStartOf(p).getTime() + idx * 86400000); }
  function checkinMap(p){
    var map = {}, checks = Pof(p).checks || {};
    daysOf(p).forEach(function(d, i){
      var st = checks[d.id];
      if(st && st.done){
        var at = st.at || fmt(dayDateOf(p, i));
        map[at] = (map[at] || 0) + 1;
      }
    });
    var w = wordStateOf(p);
    if(w && w.log) Object.keys(w.log).forEach(function(k){ if(w.log[k] > 0) map[k] = (map[k] || 0) + 1; });
    var cs = chapterStateOf(p);
    Object.keys(cs).forEach(function(k){
      if(cs[k] && cs[k].done && cs[k].at) map[cs[k].at] = (map[cs[k].at] || 0) + 1;
    });
    return map;
  }
  function streakOfMap(map){
    var d = todayD(), n = 0;
    if(!map[fmt(d)]) d = new Date(d.getTime() - 86400000);
    while(map[fmt(d)]){ n++; d = new Date(d.getTime() - 86400000); }
    return n;
  }
  function heatmapHtml(p){
    var map = checkinMap(p), days = daysOf(p);
    if(!days.length) return '';
    var start = planStartOf(p), weeks = Math.ceil(days.length / 7), todayS = fmt(todayD());
    var months = '', cols = '', lastMonth = -1;
    for(var w = 0; w < weeks; w++){
      var mon = new Date(start.getTime() + w * 7 * 86400000);
      months += '<span>' + (mon.getMonth() !== lastMonth ? (mon.getMonth() + 1) + '月' : '') + '</span>';
      lastMonth = mon.getMonth();
      var col = '';
      for(var dow = 0; dow < 7; dow++){
        var idx = w * 7 + dow;
        var ds = fmt(new Date(start.getTime() + idx * 86400000));
        var inRange = idx < days.length;
        var count = inRange ? (map[ds] || 0) : 0;
        var lv = count > 0 ? Math.min(4, count) : 0;
        col += '<button type="button" class="hd' + (inRange ? (lv ? ' lv' + lv : '') : ' off') +
          (ds === todayS ? ' today' : '') + '" data-hidx="' + idx + '"' +
          (inRange ? ' title="' + ds + ' · ' + count + ' 次打卡"' : '') + '></button>';
      }
      cols += '<div class="hcol">' + col + '</div>';
    }
    var startMs = start.getTime();
    var activeDays = 0, best = 0, run = 0, prevOk = false;
    for(var ii = 0; ii < days.length; ii++){
      var kk = fmt(new Date(startMs + ii * 86400000));
      var ok = (map[kk] || 0) > 0;
      if(ok){ activeDays++; run = prevOk ? run + 1 : 1; if(run > best) best = run; }
      else run = 0;
      prevOk = ok;
    }
    var streak = streakOfMap(map);
    return '<div class="heat-row">' +
      '<div><div class="heat-months">' + months + '</div>' +
      '<div class="heat-wrap"><div class="heat">' + cols + '</div></div>' +
      '<div class="heat-legend"><span>少</span><i style="opacity:.25"></i><i style="opacity:.45"></i>' +
      '<i style="opacity:.7"></i><i></i><span>多</span></div></div>' +
      '<div class="heat-stats">' +
      '<div><b>' + activeDays + '</b><span>天打卡</span></div>' +
      '<div><b>' + streak + '</b><span>当前连续</span></div>' +
      '<div><b>' + best + '</b><span>最长连续</span></div>' +
      '</div></div>';
  }
  function bindHeat(el){
    el.querySelectorAll('[data-hidx]').forEach(function(b){
      b.addEventListener('click', function(){
        var idx = +b.dataset.hidx, list = daysOf(pid());
        if(idx < 0 || idx >= list.length) return;
        P().offset = idx; save();
        switchView('today'); window.scrollTo(0, 0);
      });
    });
  }

  // ---- 局部更新：今日计划 / 全局计数 / 章节进度
  function finishRowHtml(done){
    return done
      ? '<button class="btn" id="unfinish">标记未完成</button><span class="sub">这一天已完成</span>'
      : '<button class="btn pri" id="finish">全部达标，标记完成</button><span class="sub">也可直接把上面的今日计划全部勾上</span>';
  }
  function bindFinish(d){
    var el = document.getElementById('view');
    var f = el.querySelector('#finish');
    if(f) f.addEventListener('click', function(){
      var st = ds(d.id);
      (d.checklist || []).forEach(function(_, i){ st.c[i] = true; });
      if(wordBook() && wordToday() === 0) wordLog(wordState().perDay);
      st.done = true; st.at = fmt(todayD());
      P().offset = daysOf(pid()).indexOf(d);
      save(); renderHead(); renderToday();
      toast('已标记完成：' + shortText(d.title, 16));
    });
    var u = el.querySelector('#unfinish');
    if(u) u.addEventListener('click', function(){
      var st = ds(d.id);
      st.done = false; delete st.at;
      save(); renderHead(); renderToday();
      toast('已取消完成：' + shortText(d.title, 16));
    });
  }
  function updateTodayChecks(d, st){
    var el = document.getElementById('view');
    var checked = 0;
    el.querySelectorAll('input[data-c]').forEach(function(box){
      var on = !!st.c[+box.dataset.c];
      if(on) checked++;
      var lab = box.closest('label');
      if(lab) lab.classList.toggle('done', on);
    });
    var hasWord = !!wordBook();
    var head = el.querySelector('.plan-head');
    if(head){
      var wordDone = hasWord && wordToday() > 0 ? 1 : 0;
      head.textContent = '今日计划 · 打卡 ' + (checked + wordDone) + '/' +
        ((d.checklist || []).length + (hasWord ? 1 : 0));
    }
    var row = el.querySelector('.finish-row');
    if(row){
      var want = isDone(d);
      if(row.dataset.done !== (want ? '1' : '')){
        row.dataset.done = want ? '1' : '';
        row.innerHTML = finishRowHtml(want);
        bindFinish(d);
      }
    }
  }
  function globalCounts(){
    var out = { total: 0, done: 0, per: {} };
    Object.keys(PLANS).forEach(function(p){
      var data = planOf(p), o = { done: 0, total: 0 };
      if(data.startsLater && todayD() < dISO(data.startDate)){ out.per[p] = o; return; }
      var d = curDayOf(p);
      if(!d){ out.per[p] = o; return; }
      var sc = dsOf(p, d.id), wb = data.wordBook;
      o.total = (d.checklist || []).length + (wb ? 1 : 0);
      o.done = (d.checklist || []).filter(function(_, i){ return !!sc.c[i]; }).length +
        (wb && wordTodayOf(p) > 0 ? 1 : 0);
      out.total += o.total; out.done += o.done;
      out.per[p] = o;
    });
    return out;
  }
  function updateGlobalCounts(){
    var el = document.getElementById('view');
    if(!el) return;
    var g = globalCounts();
    var sum = el.querySelector('#gsum');
    if(sum){
      sum.textContent = g.done + ' / ' + g.total + ' 项';
      var bar = el.querySelector('#gsumBar i');
      if(bar) bar.style.width = (g.total ? Math.round(g.done / g.total * 100) : 0) + '%';
    }
    Object.keys(g.per).forEach(function(p){
      var n = el.querySelector('[data-gcount="' + p + '"]');
      if(n) n.textContent = '打卡 ' + g.per[p].done + '/' + g.per[p].total;
    });
    el.querySelectorAll('input[data-gc]').forEach(function(box){
      var lab = box.closest('label');
      if(lab) lab.classList.toggle('done', box.checked);
    });
  }
  function updateChapterDom(p){
    var cs = chapterStatsOf(p);
    if(!cs) return;
    var card = document.querySelector('.today-side [data-chap-card]');
    if(!card) return;
    var total = card.querySelector('[data-chap-total]');
    if(total) total.textContent = cs.done + ' / ' + cs.total + ' 章';
    var bar = card.querySelector('[data-chap-bar]');
    if(bar) bar.style.width = cs.pct + '%';
    cs.groups.forEach(function(gp){
      var n = card.querySelector('[data-chapgroup="' + gp.id + '"]');
      if(n) n.textContent = gp.done + '/' + gp.total;
    });
  }
  function logWords(amount){
    var wb = wordBook();
    var before = wordState().done;
    wordLog(amount);
    var after = wordState().done;
    renderHead(); renderToday();
    toast('单词 ' + (amount > 0 ? '+' : '') + amount + '（' + after + ' / ' + wb.total + '）', '撤销', function(){
      wordLog(before - after);
      renderHead(); renderToday();

  function renderHead(){
    var isGlobal = (view === 'plan');
    document.body.dataset.subject = pid();
    var bar = document.getElementById('planbar');
    bar.innerHTML = Object.keys(PLANS).map(function(k){

      }).length;

    document.getElementById('meta').textContent = isGlobal

      : metaTxt;
    document.getElementById('phases').innerHTML = isGlobal ? '' : phaseBarHtml();
    document.getElementById('phases').style.display = isGlobal ? 'none' : '';
    document.getElementById('stats').style.display = isGlobal ? 'none' : '';
    document.getElementById('mode').style.display = isGlobal ? 'none' : '';
    document.getElementById('startLabel').style.display = isGlobal ? 'none' : '';
    document.getElementById('start').style.display = isGlobal ? 'none' : '';
    document.getElementById('reset').style.display = isGlobal ? 'none' : '';

    var exT = exTotal(pid());

      ? card(wr.done + ' / ' + wr.total, '单词（第 ' + wr.w.cycle + ' 轮）', wr.pct + '%')
      : exT ? card(exDone(pid()) + ' / ' + exT, '课后题', Math.round(exDone(pid())/exT*100) + '%')
          : '<div class="stat"><b>—</b><span>课后题</span><div class="bar"><i style="width:0"></i></div>' +
            '<span style="font-size:11.5px">本科目以背诵 / 单词为主</span></div>';
    document.getElementById('stats').innerHTML = [
      card(doneN + ' / ' + st.length, '章节学习日', pct + '%'),
      secondCard,
      card(revDone(pid()) + ' / ' + reviewDays(pid()).length, '周复盘', Math.round(revDone(pid())/(reviewDays(pid()).length||1)*100) + '%'),
      card(streak(pid()) + ' 天', '连续完成', '从第 1 周算起')
    ].join('');
    document.querySelectorAll('#mode button').forEach(function(b){
      b.classList.toggle('on', b.dataset.mode === P().mode);

  function card(big, label, sub){

      '<div class="bar"><i style="width:' + (parseInt(sub)||0) + '%"></i></div>' +
