        html += '<h3 class="plan-head" style="margin-top:16px">今日计划 · 打卡 ' + (wordToday() > 0 ? 1 : 0) + '/1</h3>' + wordRowHtml();
        html += '<div class="row" style="margin-top:14px">' +
          (done ? '<button class="btn" id="unfinish">标记未完成</button>' : '<button class="btn pri" id="finish">标记完成</button>') +
          '</div>';
      }
    }else{
      // 1) 单词进度已在上面渲染

      // 2) 今日计划：每一项都能打卡
      var hasWord = !!wordBook();
      var planAll = all + (hasWord ? 1 : 0);
      var planDone = checked + (hasWord && wordToday() > 0 ? 1 : 0);
      html += '<h3 class="plan-head" style="margin-top:16px">今日计划 · 打卡 ' + planDone + '/' + planAll + '</h3>';
      if(hasWord) html += wordRowHtml();
      (d.checklist||[]).forEach(function(c,i){
        html += '<label class="check ' + (s.c[i]?'done':'') + '"><input type="checkbox" data-c="' + i + '"' +
          (s.c[i]?' checked':'') + '><span>' + esc(c) + '</span></label>';
      });

      // 3) 今天学什么
      html += '<div class="split"></div>';
      html += '<div class="kv"><b>阅读</b><span>' + esc(d.reading || '—') + '</span></div>';
      if(d.learn && d.learn.length){
        html += '<div class="kv" style="align-items:flex-start"><b>知识点</b><div><ul class="pts">' +
          d.learn.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></div>';
      }
      if(d.practice && d.practice.length){
        html += '<div class="kv" style="align-items:flex-start"><b>动手</b><div><ul class="pts">' +
          d.practice.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></div>';
      }

      // 4) 课后题
      if(d.exercises && d.exercises.length){
        html += '<h3>课后题 · ' + d.exercises.length + ' 道</h3>';
        d.exercises.forEach(function(e,idx){
          var key = pid() + ':' + e.id;
          var marked = !!state.wrong[key];
          html += '<div class="ex" data-ex="' + idx + '">' +
            '<div class="row"><div class="grow"><div class="t">' + (idx+1) + '. ' + esc(e.title) + '</div>' +
            '<span class="sub">难度 ' + (e.difficulty||2) + '/3</span></div>' +
            '<label class="check" style="padding:0"><input type="checkbox" data-e="' + idx + '"' + (s.e[idx]?' checked':'') + '><span>做对</span></label>' +
            '</div><div class="p">' + esc(e.prompt) + '</div>' +
            '<div class="hint">提示：' + esc(e.hint) + '</div>' +
            '<div class="row" style="margin-top:8px">' +
            '<button class="btn" data-ans="' + idx + '">看答案</button>' +
            '<button class="btn' + (marked ? ' on' : '') + '" data-wrong="' + idx + '">' + (marked ? '已在错题本 · 移出' : '记入错题本') + '</button>' +
            '</div><div class="ans">' + esc(e.answer) + '</div></div>';
        });
      }

      html += '<div class="row finish-row" style="margin-top:16px" data-done="' + (done ? '1' : '') + '">' +
        finishRowHtml(done) + '</div>';
    }
    html += '</div>';
    el.innerHTML = wrapToday(html);
    bindWordCard();
    bindChapter(el);
    bindSide(el);

    el.querySelectorAll('input[data-c]').forEach(function(box){
      box.addEventListener('change', function(){
        var i = +box.dataset.c;
        var st = ds(d.id);
        var prev = !!st.c[i];
        st.c[i] = box.checked;
        syncDone(d, st);
        save();
        updateTodayChecks(d, st);
        renderHead();
        toast((box.checked ? '已打卡 · ' : '已取消 · ') + shortText(d.checklist[i], 18), '撤销', function(){
          st.c[i] = prev;
          box.checked = prev;
          syncDone(d, st);
          save();
          updateTodayChecks(d, st);
          renderHead();
        });
      });
    });
    el.querySelectorAll('input[data-e]').forEach(function(box){
      box.addEventListener('change', function(){
        var st = ds(d.id);
        st.e[+box.dataset.e] = box.checked;
        save(); renderHead();
      });
    });
    el.querySelectorAll('button[data-ans]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var box = btn.closest('.ex');
        box.classList.toggle('open');
        btn.textContent = box.classList.contains('open') ? '收起答案' : '看答案';
      });
    });
    el.querySelectorAll('button[data-wrong]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var e = d.exercises[+btn.dataset.wrong];
        var key = pid() + ':' + e.id;
        if(state.wrong[key]) delete state.wrong[key];
        else state.wrong[key] = {note:'', mastered:false, at:new Date().toISOString().slice(0,10)};
        save(); renderToday();
        if(view === 'wrong') renderWrong();
      });
    });
    bindFinish(d);
    var pv = el.querySelector('#prev'), nx2 = el.querySelector('#next'), td = el.querySelector('#today');
    if(pv) pv.addEventListener('click', function(){ step(-1); });
    if(nx2) nx2.addEventListener('click', function(){ step(1); });
    if(td) td.addEventListener('click', function(){ P().offset = null; save(); renderHead(); renderToday(); });
  }
  function step(dir){
    var d = curDay();
    var list = daysOf(pid());
    var n = list.indexOf(d) + dir;
    if(n < 0 || n >= list.length) return;
    P().offset = n;
    save(); renderHead(); renderToday();
  }
  function nextStudyAfter(d){
    var list = daysOf(pid());
    for(var k=list.indexOf(d)+1;k<list.length;k++){ if(!isRest(list[k])) return list[k]; }
    return null;
  }
  function syncDone(d, st){
    var all = d.checklist || [];
    if(all.length && all.every(function(_,i){ return !!st.c[i]; })){
      if(!st.done){ st.done = true; st.at = fmt(todayD()); }
    }else if(all.length){
      st.done = false;
      delete st.at;
    }
  }

  function weekCard(w){
    var stDays = w.days.filter(function(d){ return d.kind === 'learn' || d.kind === 'practice'; });
    var dn = stDays.filter(function(d){
      var s = P().checks[d.id]; return s && s.done;
    }).length;
    return '<div class="wk" data-w="' + w.week + '"><div class="wk-h">' +
      '<span class="n">第 ' + w.week + ' 周</span><span class="ti">' + esc(w.title) + '</span>' +
      '<span class="sub">' + dn + '/' + stDays.length + ' 完成</span></div>' +
      '<div class="wk-b">' +
      (w.check ? '<div class="ck">' + esc(w.check) + '</div>' : '') +
      '<div class="sub" style="margin-bottom:6px">本周过关：' + esc(w.goal) + '</div>' +
      (w.target ? '<div class="sub" style="margin-bottom:10px">本周题量：' + esc(w.target) + '</div>' : '') +
      '<div class="days">' + w.days.map(function(d){
        var s = P().checks[d.id];
        var cls = ['day'];

  function renderWeeks(){
    var el = document.getElementById('view');
    var list = phases();
    var cur = curPhase();
    var focus = P().weeksFilter || (cur && cur.id) || 'all';

    var html = '<div class="card" style="padding:12px 14px"><div class="row">' +
      '<span class="sub" style="flex:0 0 auto">只看</span>' +
      '<div class="pseg" style="margin:0">' +
      '<button class="pseg-b' + (focus === 'all' ? ' on' : '') + '" data-wf="all">全部</button>' +
      list.map(function(x){
        return '<button class="pseg-b' + (focus === x.id ? ' on' : '') + '" data-wf="' + x.id + '">' +
          '第 ' + x.seq + ' 阶段 · ' + esc(x.short) + '</button>';
      }).join('') +
      '</div></div></div>';

    var groups = focus === 'all' ? list : list.filter(function(x){ return x.id === focus; });
    html += '<div class="weeks">';
    groups.forEach(function(ph){
      var wks = phaseWeeks(ph);
      html += '<div class="phase-h"><h2>' + esc(ph.name) + '</h2>' + phaseBadge(ph) +
        '<span class="sub">' + shortDate(ph.start) + ' → ' + shortDate(ph.end) + ' · ' + ph.weeks + ' 周' +
        (wks.length ? ' · 细化 ' + wks.length + ' 周' : ' · 未细化') + '</span></div>';
      if(wks.length) html += wks.map(weekCard).join('');
      if(wks.length < ph.weeks){
        (ph.blocks || []).filter(function(b){ return !b.detail; }).forEach(function(b){
          html += '<div class="wk skel"><div class="skel-h"><span class="n">' + esc(b.name) +
            (b.weeks > 1 ? ' · ' + b.weeks + ' 周' : '') + '</span><span class="c">' + esc(b.content) +
            '</span><span class="pill wait">待细化</span></div></div>';
        });
      }
    });
    el.innerHTML = html + '</div>';

    el.querySelectorAll('[data-wf]').forEach(function(b){
      b.addEventListener('click', function(){
        P().weeksFilter = b.dataset.wf;
        save();
        renderWeeks();
        window.scrollTo(0, 0);
      });
    });
    el.querySelectorAll('.wk-h').forEach(function(h){
      h.addEventListener('click', function(){ h.parentElement.classList.toggle('open'); });
    });
    el.querySelectorAll('.day').forEach(function(cell){
      cell.addEventListener('click', function(){
        var l = daysOf(pid());
        P().offset = l.indexOf(dayById(pid(), cell.dataset.day));
        save();
        view = 'today';
        document.querySelectorAll('#tabs .tab').forEach(function(t){ t.classList.toggle('on', t.dataset.view === 'today'); });
        renderHead(); renderToday();
      });
    });

  function focusPhase(){
    var list = phases();
    if(!list.length) return null;
    var id = P().phaseFocus, hit = null;
    list.forEach(function(ph){ if(ph.id === id) hit = ph; });
    return hit || curPhase();
  }
  function gotoPhase(id){
    P().phaseFocus = id;
    save();
    if(view === 'phase') renderPhases(); else switchView('phase');
    var anchor = document.getElementById('view');
    if(anchor) window.scrollTo({ top: anchor.getBoundingClientRect().top + window.pageYOffset - 12, behavior: 'auto' });
  }
  function renderPhaseCard(ph){
    var st = phaseState(ph), s = phaseStats(ph);
    var pct = s.study ? Math.round(s.done/s.study*100) : 0;
    var wsum = (ph.mainline||[]).reduce(function(n,m){ return n + (m.weeks||0); }, 0);
    var html = '<div class="phc' + (st === 'active' ? ' on' : '') + '" id="ph-' + ph.id + '">' +
      '<div class="phc-h"><h2>' + esc(ph.name) + '</h2>' + phaseBadge(ph) + '</div>' +
      '<div class="dates">' + ph.start + ' → ' + ph.end + ' · ' + ph.weeks + ' 周 · 每周 ' + esc(ph.hoursPerWeek || '') + '</div>';

    if(s.weeks){
      html += '<div class="lp" style="margin-top:12px"><div class="h"><span>细化排期 · ' + s.weeks + ' 周</span>' +
        '<span class="muted">' + s.done + '/' + s.study + ' 学习日</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
        '<div class="sub" style="margin-top:4px">' + (s.ex ? '课后题 ' + s.exDone + '/' + s.ex + ' · ' : '') +

    }else{
      html += '<div class="sub" style="margin-top:8px">暂无逐日排期：先锁定阶段目标与主线，细化等前一阶段收口后再排。</div>';
    }

    html += '<div class="lbl">阶段目标</div><div style="font-size:14px">' + esc(ph.goal) + '</div>';

    if(ph.mainline && ph.mainline.length){
      html += '<div class="lbl">主线' + (wsum ? '（' + wsum + ' 周）' : '') + '</div>';
      ph.mainline.forEach(function(m){
        html += '<div class="ml"><b>' + esc(m.name) + (m.weeks ? '<small>' + m.weeks + ' 周</small>' : '') + '</b><span>' + esc(m.content) + '</span></div>';
      });
    }
    if(ph.outputs && ph.outputs.length){
      html += '<div class="lbl">阶段产出</div><ul class="pts">' +
        ph.outputs.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    if(ph.checkpoints && ph.checkpoints.length){
      html += '<div class="lbl">检查点</div>';

        html += '<div class="ckp"><span class="dt">' + esc(String(c.date)) + '</span><div><b>' + esc(c.what) +
          '</b><div class="sub">达标线：' + esc(c.pass) + '</div></div></div>';
      });
    }
    if(ph.exit && ph.exit.length){
      html += '<div class="lbl">进入下一阶段的门槛</div><ul class="pts">' +
        ph.exit.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    if(ph.blocks && ph.blocks.length){
      html += '<div class="lbl">周骨架 · ' + ph.weeks + ' 周</div>';
      ph.blocks.forEach(function(b){
        html += '<div class="blk' + (b.detail ? ' detail' : '') + '"><b>' + esc(b.name) +
          (b.weeks > 1 && !b.detail ? ' · ' + b.weeks + ' 周' : '') + '</b><span class="c">' + esc(b.content) + '</span></div>';
      });
    }
    return html + '</div>';

  function renderPhases(){
    var el = document.getElementById('view');
    var list = phases();
    if(!list.length){ el.innerHTML = '<div class="card empty">这份计划还没有配置阶段。</div>'; return; }
    var now = todayD();
    var phNow = curPhase();
    var ph = focusPhase();
    var idx = list.indexOf(ph);
    var exam = plan().examDate ? dISO(plan().examDate) : null;
    var nowTxt = [];
    if(phNow){
      var stNow = phaseState(phNow);
      nowTxt.push(esc(phNow.name) + (stNow === 'active'
        ? '（第 ' + phaseWeekIndex(phNow) + '/' + phNow.weeks + ' 周，剩 ' + Math.max(0, diffDays(dISO(phNow.end), now)) + ' 天）'
        : stNow === 'done' ? '（已结束）' : '（' + diffDays(dISO(phNow.start), now) + ' 天后开始）'));
    }
    if(exam) nowTxt.push('距初试 ' + fmt(exam) + ' 还有 ' + Math.max(0, diffDays(exam, now)) + ' 天');

    var html = '<div class="card"><div class="row"><h2 style="margin:0" class="grow">全年阶段路线</h2>' +
      '<span class="sub">' + shortDate(plan().startDate) + ' → ' + shortDate(plan().examDate || list[list.length-1].end) +
      ' · ' + list.length + ' 段 / ' + totalPhaseWeeks() + ' 周</span></div>' +
      '<div class="sub" style="margin-top:6px">' + esc(plan().yearGoal || '') + '</div>' +
      '<div class="kv" style="margin-top:10px"><b>现在</b><span>' + nowTxt.join(' · ') + '</span></div>' +
      '<div class="sub">阶段 = 时间 + 目标 + 主线 + 门槛。点下面的段直接换内容，不在同一页往下堆。</div>' +
      '<h3 style="margin-bottom:6px">切换阶段</h3>' +
      '<div class="pseg">' +
      list.map(function(x){
        var st = phaseState(x);
        return '<button class="pseg-b' + (ph && x.id === ph.id ? ' on' : '') + (st === 'done' ? ' done' : '') +
          '" data-focus="' + x.id + '">第 ' + x.seq + ' 阶段 · ' + esc(x.short) +
          '<small>' + shortDate(x.start) + ' → ' + shortDate(x.end) + ' · ' + x.weeks + ' 周</small></button>';
      }).join('') +
      '</div></div>';

    html += '<div class="row" style="margin:2px 0 0">' +
      '<button class="btn" data-pnav="-1"' + (idx <= 0 ? ' disabled' : '') + '>← 上一段</button>' +
      '<button class="btn" data-pnav="1"' + (idx >= list.length - 1 ? ' disabled' : '') + '>下一段 →</button>' +
      '<span class="sub">第 ' + (idx + 1) + ' / ' + list.length + ' 段</span>' +
      (phNow && ph && phNow.id !== ph.id ? '<button class="btn ghost" data-pnow="1">回到当前阶段</button>' : '') +
      '</div>';

    html += renderPhaseCard(ph);

    html += '<div class="card" style="margin-top:12px"><h3 style="margin-top:0">阶段怎么推进</h3><ul class="pts">' +
      '<li>门槛制：上一阶段的门槛没过，先补 1–2 周再进下一段，不要两段平行推进。</li>' +
      '<li>只有当前阶段排到天；后面阶段只锁周数和主线，避免照着假计划跑。</li>' +
      '<li>阶段按固定日期走（从初试倒排），顶部「当前阶段」自动切换，历史勾选不受影响；「开始日期」只影响逐日排期。</li>' +
      '<li>要改阶段时间或目标：改 <code>build_phases.py</code> → 跑脚本 → 重新生成页面（见 README「改计划」）。</li>' +
      '</ul></div>';
    el.innerHTML = html;

    el.querySelectorAll('[data-focus]').forEach(function(b){
      b.addEventListener('click', function(){ gotoPhase(b.dataset.focus); });
    });
    el.querySelectorAll('[data-pnav]').forEach(function(b){
      b.addEventListener('click', function(){
        var n = idx + parseInt(b.dataset.pnav, 10);
        if(n < 0 || n >= list.length) return;
        gotoPhase(list[n].id);
      });
    });
    var backNow = el.querySelector('[data-pnow]');
    if(backNow) backNow.addEventListener('click', function(){ gotoPhase(phNow.id); });
  }

  function statGroups(p){
    if(p === 'math2') return [{name:'高数（第 1–7 周）', from:1, to:7}, {name:'线代（第 8–10 周）', from:8, to:10},
      {name:'错题与总测（第 11–12 周）', from:11, to:12}];
    if(p === 'cs408') return [{name:'数据结构（第 1–5 周）', from:1, to:5}, {name:'计算机组成原理（第 6–9 周）', from:6, to:9},
      {name:'操作系统（第 10–11 周）', from:10, to:11}, {name:'计算机网络（第 12 周）', from:12, to:12}];
    return phases().filter(function(ph){ return phaseWeeks(ph).length; }).map(function(ph){
      var ws = phaseWeeks(ph), a = ws[0].week, b = ws[ws.length-1].week;
      return {name: ph.short + '（第 ' + a + (b > a ? '–' + b : '') + ' 周）', from:a, to:b};
    });
  }
  function renderStats(){

      '<h3>阶段进度</h3><div class="list-prog">' +

        var ps = phaseStats(ph), pc = ps.study ? Math.round(ps.done/ps.study*100) : 0;
        return '<div class="lp"><div class="h"><span>' + esc(ph.name) + '</span><span class="muted">' +
          (ps.study ? ps.done + '/' + ps.study : '待细化') + '</span></div>' +
          '<div class="bar"><i style="width:' + pc + '%"></i></div></div>';
      }).join('') + '</div>' +
      '<!--CHAPTERS-->' +

      html += '<div class="lp"><div class="h"><span>' + esc(g.name) + '</span><span class="muted">' + dn + '/' + list.length +
        '</span></div><div class="bar"><i style="width:' + pc + '%"></i></div></div>';
    });
    html += '</div><h3>逐周完成情况</h3>';
    plan().weeks.forEach(function(w){
      var list = w.days.filter(function(d){ return d.kind === 'learn' || d.kind === 'practice'; });
      var dn = list.filter(function(d){ var s = P().checks[d.id]; return s && s.done; }).length;
      var pc = Math.round(dn/list.length*100);
      html += '<div class="row" style="padding:4px 0;font-size:13px"><span style="flex:0 0 62px" class="muted">第 ' + w.week +
        ' 周</span><div class="bar grow" style="margin:0"><i style="width:' + pc + '%"></i></div>' +
        '<span style="flex:0 0 54px;text-align:right" class="muted">' + dn + '/' + list.length + '</span></div>';
    });
    html += '</div>';
    var cs = chapterStatsOf(p);
    var chapBlock = cs
      ? '<h3>章节进度 · ' + cs.done + '/' + cs.total + ' 章</h3>' +
        '<div class="sub" style="margin-bottom:6px">' + esc(cs.title) + '</div>' +
        '<div class="list-prog">' + cs.groups.map(function(g){
          return '<div class="lp"><div class="h"><span>' + esc(g.short) + '</span><span class="muted">' + g.done + '/' + g.total +
            '</span></div><div class="bar"><i style="width:' + g.pct + '%"></i></div></div>';
        }).join('') + '</div>' +
        '<div class="chapters wide">' + chapterListHtml(p) + '</div>'
      : '';
    var heat = heatmapHtml(p);
    html = html.replace('<!--CHAPTERS-->', '<h3>打卡日历</h3>' + heat + chapBlock);
    document.getElementById('view').innerHTML = html;
    bindChapter(document.getElementById('view'));
    bindHeat(document.getElementById('view'));
  }

  function wrongList(){
    var out = [];
    Object.keys(state.wrong).forEach(function(key){
      var parts = key.split(':');
      var p = parts[0], exId = parts[1];
      if(!PLANS[p]) return;
      var day = null, ex = null;
      daysOf(p).forEach(function(d){
        (d.exercises||[]).forEach(function(e){ if(e.id === exId){ day = d; ex = e; } });
      });
      if(ex && day) out.push({key:key, pid:p, day:day, ex:ex, rec:state.wrong[key]});
    });
    out.sort(function(a,b){
      if(a.pid !== b.pid) return a.pid === 'math2' ? -1 : 1;
      return a.day.week - b.day.week;
    });
    return out;
  }
  function renderWrong(){
    var list = wrongList();
    var el = document.getElementById('view');
    if(!list.length){
      el.innerHTML = '<div class="card empty">还没有错题。在「单科今日」里每道课后题旁边点「记入错题本」，这里会自动汇总。</div>';
      return;
    }
    var mastered = list.filter(function(x){ return x.rec.mastered; }).length;
    var html = '<div class="card"><div class="row"><h2 style="margin:0" class="grow">错题本</h2>' +
      '<span class="sub">共 ' + list.length + ' 道 · 已掌握 ' + mastered + ' 道</span></div>';
    list.forEach(function(x){
      html += '<div class="wrong ' + (x.rec.mastered ? 'mastered' : '') + '" data-key="' + x.key + '">' +
        '<div class="head"><span class="badge k-' + x.day.kind + '">' + esc(PLAN_META[x.pid].short) + '</span>' +
        '<span class="t">' + esc(x.ex.title) + '</span><div class="grow"></div>' +
        '<span class="meta">第 ' + x.day.week + ' 周 · ' + esc(x.day.title) + '</span></div>' +
        '<div class="prompt">' + esc(x.ex.prompt) + '</div>' +
        '<textarea placeholder="写一句错因：概念不清 / 公式记错 / 计算失误 / 没思路" data-note="' + x.key + '">' + esc(x.rec.note || '') + '</textarea>' +
        '<div class="row" style="margin-top:8px">' +
        '<label class="check" style="padding:0"><input type="checkbox" data-mastered="' + x.key + '"' + (x.rec.mastered?' checked':'') + '><span>已掌握</span></label>' +
        '<div class="grow"></div>' +
        '<button class="btn sm" data-ans-wrong="' + x.key + '">看答案</button>' +
        '<button class="btn sm" data-remove="' + x.key + '">移出</button></div>' +
        '<div class="ans" style="display:none;font-size:13px;background:#f4f7fb;border-left:3px solid var(--accent);padding:8px 10px;border-radius:6px;margin-top:8px;white-space:pre-wrap">' +
        esc(x.ex.answer) + '</div></div>';
    });
    html += '</div>';
    el.innerHTML = html;

    el.querySelectorAll('textarea[data-note]').forEach(function(t){
      t.addEventListener('input', function(){
        var k = t.dataset.note;
        if(!state.wrong[k]) return;
        state.wrong[k].note = t.value;
        save();
      });
    });
    el.querySelectorAll('input[data-mastered]').forEach(function(box){
      box.addEventListener('change', function(){
        var k = box.dataset.mastered;
        if(!state.wrong[k]) return;
        state.wrong[k].mastered = box.checked;
        save(); renderWrong();
      });
    });
    el.querySelectorAll('button[data-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){
        delete state.wrong[btn.dataset.remove];
        save(); renderWrong();
      });
    });
    el.querySelectorAll('button[data-ans-wrong]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var box = btn.closest('.wrong').querySelector('.ans');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
        btn.textContent = box.style.display === 'none' ? '看答案' : '收起';
      });
    });
  }

  var view = 'plan';
  function render(){
    renderHead();
    if(view === 'plan') renderGlobalPlan();
    else if(view === 'today') renderToday();
    else if(view === 'phase') renderPhases();
    else if(view === 'weeks') renderWeeks();
    else if(view === 'stats') renderStats();
    else renderWrong();
  }
  function switchView(v){
    view = v;
    document.querySelectorAll('#tabs .tab').forEach(function(t){ t.classList.toggle('on', t.dataset.view === v); });
    render();
  }

  document.querySelectorAll('#tabs .tab').forEach(function(t){
    t.addEventListener('click', function(){ switchView(t.dataset.view); });
  });
  document.getElementById('phases').addEventListener('click', function(e){
    var b = e.target.closest('button[data-phase]');
    if(!b) return;
    P().phaseFocus = b.dataset.phase;
    save();
    switchView('phase');
    window.scrollTo({ top: 0, behavior: 'auto' });
  });
  document.getElementById('planbar').addEventListener('click', function(e){
    var b = e.target.closest('button[data-plan]');
    if(!b) return;
    state.active = b.dataset.plan;
    P().offset = null;
    save();
    if(view === 'plan'){ switchView('today'); return; }
    if(view === 'today' || view === 'phase' || view === 'weeks' || view === 'stats') render(); else { renderHead(); renderWrong(); }
  });
  document.querySelectorAll('#mode button').forEach(function(b){
    b.addEventListener('click', function(){
      P().mode = b.dataset.mode;
      P().offset = null;
      save(); renderHead();
      if(view !== 'today') switchView('today'); else renderToday();
    });
  });
  document.getElementById('start').addEventListener('change', function(e){
    if(!e.target.value) return;
    P().startDate = e.target.value;
    P().offset = null;
    save(); render();
  });
  document.getElementById('export').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify({version:2, exportedAt:new Date().toISOString(), state:state}, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'study-progress-' + fmt(new Date()) + '.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  });
  document.getElementById('import').addEventListener('click', function(){
    document.getElementById('file').click();
  });
  document.getElementById('file').addEventListener('change', function(e){
    var f = e.target.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result);
        var s = d.state || d;
        if(s && s.plans && s.active && PLANS[s.active]){
          state = normalize(s);
          save(); render();
        }else{
          alert('文件格式不对，需要本页导出的进度文件。');
        }
      }catch(err){ alert('不是合法的 JSON。'); }
    };
    r.readAsText(f);
    e.target.value = '';
  });
  document.getElementById('reset').addEventListener('click', function(){
    if(!confirm('清空「' + PLAN_META[pid()].short + '」的勾选与完成记录？另一科目与错题本不受影响。')) return;
    state.plans[pid()] = blank(pid());
    save(); render();
  });

  document.getElementById('foot').textContent =
    '数据只存本机浏览器（localStorage），换设备用「导出」带走。「今日计划」是四科合一的打卡清单；知识点、课后题、单词量设置进「单科今日」。 · v2026.11.07';

  render();
})();
</script>
</body>
</html>
